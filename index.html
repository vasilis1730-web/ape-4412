<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ΑΠΕ — Ανακεφαλαιωτικοί Πίνακες Εργασιών</title>
<style>
:root{
  --ink:#10151C; --ink2:#3C4756; --ink3:#6B7887;
  --paper:#FFFFFF; --surface:#EEF1F4; --line:#D5DBE1; --line2:#E7EBEF;
  --rail:#16202E; --rail2:#0E1622; --railText:#93A3B5;
  --s1:#4C6EF5; --s2:#0CA678; --s3:#F08C00; --s4:#E03131;
  --s5:#7048E8; --s6:#1098AD; --s7:#2F9E44; --s8:#5C6B7A;
  --ok:#2B8A3E; --warn:#E8590C; --bad:#C92A2A; --info:#1864AB;
  --okBg:#EBFBEE; --warnBg:#FFF4E6; --badBg:#FFF5F5; --infoBg:#E7F5FF;
  --ui:"Segoe UI",Roboto,"Noto Sans",system-ui,-apple-system,Arial,sans-serif;
  --num:"Cascadia Mono",Consolas,"SF Mono","DejaVu Sans Mono",monospace;
  --doc:Calibri,"Segoe UI","Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ui);font-size:14px;color:var(--ink);background:var(--surface);overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#app{display:flex;height:100vh}

/* ── RAIL ── */
.rail{width:246px;flex:0 0 246px;background:var(--rail);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:.02em}
.brand span{display:block;color:var(--railText);font-size:11px;margin-top:3px;line-height:1.4}
.steps{padding:10px 8px;flex:1}
.step{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin-bottom:3px;
  background:transparent;border:0;border-radius:7px;cursor:pointer;text-align:left;color:var(--railText);
  transition:background .12s,color .12s}
.step:hover{background:rgba(255,255,255,.06);color:#E7ECF2}
.step.on{background:rgba(255,255,255,.11);color:#fff}
.step .dot{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--num);font-size:12px;font-weight:700;color:#fff}
.step .lbl{font-size:13.5px;line-height:1.25}
.step .sub{display:block;font-size:10.5px;opacity:.62;margin-top:1px}
.step.on .sub{opacity:.8}
.railFoot{padding:10px 12px 14px;border-top:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:6px}
.railFoot button{background:rgba(255,255,255,.07);color:#D5DDE6;border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:7px 9px;cursor:pointer;font-size:12px;text-align:left}
.railFoot button:hover{background:rgba(255,255,255,.14);color:#fff}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--paper);border-bottom:1px solid var(--line);padding:11px 22px;
  display:flex;align-items:center;gap:16px;flex:0 0 auto}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .t span{font-size:11.5px;color:var(--ink3)}
.content{flex:1;overflow-y:auto;padding:22px 26px 40px}
.wrap{max-width:1180px}

/* ── METERS ── */
.meters{flex:0 0 auto;background:var(--rail2);padding:9px 22px;display:flex;gap:26px;align-items:center;overflow-x:auto}
.meter{min-width:170px;flex:1}
.meter .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.meter .mn{font-size:10.5px;color:var(--railText);letter-spacing:.02em;white-space:nowrap}
.meter .mv{font-family:var(--num);font-size:12px;font-weight:700;color:#fff}
.bar{height:6px;background:rgba(255,255,255,.13);border-radius:3px;position:relative;overflow:visible}
.bar i{display:block;height:100%;border-radius:3px;transition:width .18s}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.55}
.mtag{font-size:10px;margin-top:3px;color:var(--railText)}

/* ── BLOCKS ── */
h2.pt{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
p.pd{margin:0 0 18px;color:var(--ink3);font-size:13px;max-width:760px;line-height:1.5}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card>h3{margin:0;padding:11px 16px;font-size:13px;background:#F7F9FB;border-bottom:1px solid var(--line2);
  letter-spacing:.02em;display:flex;align-items:center;gap:9px}
.card>h3 .pill{font-family:var(--num);font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--ink);color:#fff}
.cb{padding:15px 16px}
.grid{display:grid;gap:12px 16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
label.f{display:block}
label.f>span{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:600;letter-spacing:.01em}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);
  border-radius:6px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--s1);box-shadow:0 0 0 3px rgba(76,110,245,.15)}
input.num,td input{font-family:var(--num);text-align:right}
textarea{min-height:76px;resize:vertical;line-height:1.5}
.hint{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.45}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:7px;border:1px solid transparent;
  cursor:pointer;font-size:13px;font-weight:600;background:var(--ink);color:#fff;transition:filter .12s}
.btn:hover{filter:brightness(1.14)}
.btn.gh{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.gh:hover{background:#F3F6F8;filter:none}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn.c1{background:var(--s1)}.btn.c2{background:var(--s2)}.btn.c3{background:var(--s3)}
.btn.c4{background:var(--s4)}.btn.c5{background:var(--s5)}.btn.c6{background:var(--s6)}
.btn.c7{background:var(--s7)}.btn.c8{background:var(--s8)}
.btn.dgr{background:#fff;color:var(--bad);border-color:#F1C9C9;padding:4px 8px;font-size:11.5px}
.btn.dgr:hover{background:var(--badBg);filter:none}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* ── TABLES ── */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:#F2F5F8;text-align:left;padding:7px 8px;font-size:11px;font-weight:700;color:var(--ink2);
  border-bottom:1px solid var(--line);letter-spacing:.02em;position:sticky;top:0;z-index:2}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;font-family:var(--num);white-space:nowrap}
table.t td.c,table.t th.c{text-align:center}
table.t tbody tr:hover{background:#FAFCFD}
tr.grp td{background:#EDF2F7;font-weight:700;font-size:12px}
tr.grp td:first-child{border-left:3px solid var(--s2)}
tr.sum td{background:#F7F9FB;font-weight:700}
tr.tot td{background:var(--ink);color:#fff;font-weight:700}
tr.chg td{background:#FFFBF0}
tr.newi td{background:#F6F2FF}
td input.q{width:88px;padding:4px 6px;border:1px solid var(--line);border-radius:5px}
td input.q.d{border-color:var(--s4);background:#FFF6F6}
td input.q.u{border-color:var(--s2);background:#F3FCF7}
.plus{color:var(--ok);font-weight:600}
.minus{color:var(--bad);font-weight:600}
.zero{color:var(--ink3)}
.scroll{overflow:auto;max-height:66vh}

/* ── STATUS ── */
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.st b{width:7px;height:7px;border-radius:50%;display:block}
.st.ok{background:var(--okBg);color:var(--ok)}.st.ok b{background:var(--ok)}
.st.warn{background:var(--warnBg);color:var(--warn)}.st.warn b{background:var(--warn)}
.st.bad{background:var(--badBg);color:var(--bad)}.st.bad b{background:var(--bad)}
.st.info{background:var(--infoBg);color:var(--info)}.st.info b{background:var(--info)}
.st.na{background:#F0F2F4;color:var(--ink3)}.st.na b{background:var(--ink3)}
.note{border-left:3px solid var(--info);background:var(--infoBg);padding:10px 13px;border-radius:0 7px 7px 0;
  font-size:12.5px;line-height:1.55;margin:0 0 13px}
.note.w{border-color:var(--warn);background:var(--warnBg)}
.note.b{border-color:var(--bad);background:var(--badBg)}
.note.g{border-color:var(--ok);background:var(--okBg)}
.note b{font-weight:700}
.kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.kv:last-child{border:0}
.kv .k{color:var(--ink2)}
.kv .v{font-family:var(--num);font-weight:700;white-space:nowrap}
.kv.hi{font-size:14.5px}.kv.hi .v{color:var(--s1)}

/* ── DOC PREVIEW ── */
.docbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 40px;font-family:var(--doc);
  font-size:13.5px;line-height:1.62;color:#111;max-width:900px}
.doc h1{font-size:19px;text-align:center;margin:0 0 6px;letter-spacing:.02em}
.doc h2{font-size:15px;margin:22px 0 9px;letter-spacing:.01em}
.doc h3{font-size:13.5px;margin:16px 0 7px}
.doc p{margin:0 0 9px;text-align:justify}
.doc table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0 14px}
.doc table td,.doc table th{border:1px solid #9aa;padding:5px 7px}
.doc table th{background:#e6e9ec;text-align:left;font-size:11.5px}
.doc table td.n{text-align:right;white-space:nowrap}
.doc .hdr{display:flex;justify-content:space-between;gap:30px;margin-bottom:20px;font-size:12px}
.doc .hdr div{flex:1}
.doc .sig{display:flex;justify-content:space-around;gap:30px;margin-top:46px;text-align:center;font-size:12.5px}
.doc .ph{background:#FFF6D6;padding:0 3px;font-style:italic;border-bottom:1px dotted #C9A227}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:5px;text-align:justify}
.doc .ctr{text-align:center}
.doc .rgt{text-align:right}

/* ── MISC ── */
.tag{display:inline-block;font-family:var(--num);font-size:10.5px;padding:1px 5px;border-radius:4px;
  background:#EDF1F5;color:var(--ink2);border:1px solid var(--line2)}
.tag.n{background:#F3EEFF;color:var(--s5);border-color:#DDD0FA}
.empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.empty b{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px}
.split{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:1fr}}
.sticky{position:sticky;top:0}
.projbar{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.09)}
.projsel{width:100%;padding:7px 8px;border-radius:7px;background:rgba(255,255,255,.09);
  color:#E7ECF2;border:1px solid rgba(255,255,255,.13);font-size:12.5px;cursor:pointer}
.projsel:focus{outline:none;border-color:var(--s1)}
.projrow{display:flex;gap:6px;margin-top:6px}
.projrow button{flex:1;background:rgba(255,255,255,.07);color:#D5DDE6;border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:5px 6px;cursor:pointer;font-size:11.5px}
.projrow button:hover{background:rgba(255,255,255,.15);color:#fff}
.drop{border:2px dashed var(--line);border-radius:9px;padding:16px;text-align:center;
  background:#FAFCFD;transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover{border-color:var(--s2)}
.drop.over{border-color:var(--s2);background:#EEFBF4}
.drop b{display:block;font-size:13px;margin-bottom:3px}
.drop span{font-size:11.5px;color:var(--ink3)}
tr.prevrow td{background:#F7FAFF}
button.clip{border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;
  font-size:12px;line-height:1;padding:3px 6px;margin-left:6px;vertical-align:middle;opacity:.75}
button.clip:hover{opacity:1;border-color:var(--s1);background:#F2F5FF}
label.f>span{display:flex;align-items:center}
label.f>span .clip{margin-left:auto}
#modal{display:none;position:fixed;inset:0;background:rgba(16,21,28,.55);z-index:50;
  align-items:center;justify-content:center;padding:28px}
.mbox{background:#fff;border-radius:12px;max-width:940px;width:100%;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(0,0,0,.3)}
.mbox>h3{margin:0;padding:13px 18px;font-size:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mbody{padding:16px 18px;overflow:auto}
@media print{
  .rail,.topbar,.meters,.docbar,.noprint{display:none!important}
  body{overflow:visible;background:#fff}
  .content{overflow:visible;padding:0}
  .doc{border:0;padding:0;max-width:none}
  #app{display:block;height:auto}
}
</style>
</head>
<body>
<div id="login"></div>
<div id="app">
  <aside class="rail">
    <div class="brand">
      <b>ΑΠΕ</b>
      <span>Ανακεφαλαιωτικοί Πίνακες Εργασιών · Ν. 4412/2016</span>
    </div>
    <div class="projbar" id="projbar"></div>
    <div class="projbar" id="syncbar"></div>
    <nav class="steps" id="steps"></nav>
    <div class="railFoot">
      <button onclick="exportXlsx()">📊 Εξαγωγή σε Excel</button>
      <button onclick="saveJSON(false)">💾 Αποθήκευση έργου (.json)</button>
      <button onclick="saveJSON(true)">🗃 Εξαγωγή όλης της βιβλιοθήκης</button>
      <button onclick="document.getElementById('batchf').click()" style="background:var(--s1);border-color:var(--s1);color:#fff;font-weight:700">📥 Μαζική εισαγωγή εγγράφων</button>
      <button onclick="document.getElementById('budf').click()" style="background:var(--s2);border-color:var(--s2);color:#fff;font-weight:600">📂 Φόρτωση προϋπολογισμού</button>
      <button onclick="document.getElementById('offf').click()" style="background:var(--s3);border-color:var(--s3);color:#fff;font-weight:600">💼 Εισαγωγή οικονομικής προσφοράς</button>
      <button onclick="document.getElementById('loadf').click()">🗂 Άνοιγμα αποθηκευμένου έργου</button>

      <button onclick="resetAll()">🗑 Νέο κενό έργο</button>
      <input type="file" id="loadf" accept=".json" style="display:none" onchange="loadJSON(event)">
      <input type="file" id="budf" accept=".pdf,.xlsx,.csv,.txt,.json" style="display:none" onchange="loadBudgetFile(event)">
      <input type="file" id="offf" accept=".pdf,.txt" style="display:none" onchange="loadOfferFile(event)">
      <input type="file" id="docf" accept=".pdf,.txt,.html" style="display:none" onchange="loadDocFile(event)">
      <input type="file" id="audf" accept=".pdf,.txt" multiple style="display:none" onchange="loadAuditFile(event)">
      <input type="file" id="batchf" accept=".pdf,.xlsx,.txt,.html" multiple style="display:none" onchange="batchImport(event)">
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="t"><b id="ttl">—</b><span id="sub">—</span></div>
      <div class="row" id="topActions"></div>
    </header>
    <div class="content"><div class="wrap" id="content"></div></div>
    <footer class="meters" id="meters"></footer>
  </div>
</div>
<div id="modal"></div>
<script>
/* ══════════════════════════════════════════════════════════════
   ΑΝΑΓΝΩΣΤΗΣ PDF
   Αυτόνομη εξαγωγή κειμένου με διάταξη, χωρίς εξωτερικές βιβλιοθήκες.
   Χρησιμοποιεί το DecompressionStream του browser για τα FlateDecode ρεύματα
   και διαβάζει τους πίνακες ToUnicode ώστε να αποδίδονται σωστά τα ελληνικά.
   ══════════════════════════════════════════════════════════════ */

async function inflate(bytes){
 if(typeof DecompressionStream==='undefined')
  throw new Error('Ο φυλλομετρητής δεν υποστηρίζει αποσυμπίεση PDF. Χρησιμοποιήστε Chrome, Edge, Firefox ή Safari σε πρόσφατη έκδοση.');
 // 1) zlib (RFC1950) 2) raw deflate (RFC1951) 3) παράλειψη τυχόν σκουπιδιών στην αρχή
 const tries=[['deflate',0],['deflate-raw',0],['deflate',1],['deflate-raw',1]];
 for(const [fmt,skip] of tries){
  try{
   const src=skip?bytes.subarray(skip):bytes;
   const ds=new DecompressionStream(fmt);
   const w=ds.writable.getWriter(); w.write(src); w.close();
   const buf=await new Response(ds.readable).arrayBuffer();
   if(buf.byteLength) return new Uint8Array(buf);
  }catch(e){}
 }
 return null;
}
const LAT=new TextDecoder('latin1');
const bin=b=>LAT.decode(b);

function pdfObjects(u8){
 const s=bin(u8), objs=new Map();
 const re=/(\d+)\s+(\d+)\s+obj\b/g; let m;
 while((m=re.exec(s))){
  const num=+m[1], start=m.index+m[0].length;
  const end=s.indexOf('endobj',start);
  if(end<0) continue;
  objs.set(num,{num,start,end,body:s.slice(start,end)});
 }
 return {s,objs};
}
function dictOf(body){ // το λεξικό πριν από το stream
 const i=body.indexOf('<<'); if(i<0) return '';
 let d=0,j=i;
 for(;j<body.length-1;j++){
  if(body[j]==='<'&&body[j+1]==='<'){d++;j++;}
  else if(body[j]==='>'&&body[j+1]==='>'){d--;j++;if(!d)break;}
 }
 return body.slice(i,j+1);
}
async function rawStream(u8,s,o){
 const k=s.indexOf('stream',o.start);
 if(k<0||k>o.end) return null;
 let p=k+6;
 if(s[p]==='\r')p++;
 if(s[p]==='\n')p++;
 let e=s.indexOf('endstream',p);
 if(e<0||e>o.end+9) e=o.end;
 const dict=dictOf(o.body);
 const lm=dict.match(/\/Length\s+(\d+)(?!\s+\d+\s+R)/);
 let stop=e;
 if(lm){const L=+lm[1]; if(p+L<=s.length && p+L<=e+4) stop=p+L;}
 const bytes=u8.subarray(p,stop);
 if(/\/FlateDecode/.test(dict)) return await inflate(bytes);
 if(/\/Filter/.test(dict)) return null; // άλλο φίλτρο — δεν υποστηρίζεται
 return bytes;
}

/* ── ToUnicode ── */
function parseCMap(txt){
 const map=new Map(); let bytes=1;
 const cs=txt.match(/begincodespacerange([\s\S]*?)endcodespacerange/);
 if(cs){const h=cs[1].match(/<([0-9A-Fa-f]+)>/); if(h) bytes=Math.max(1,Math.round(h[1].length/2));}
 const hx=h=>{let r='';for(let i=0;i+3<h.length+1;i+=4){const c=parseInt(h.substr(i,4),16);if(!isNaN(c))r+=String.fromCharCode(c);}return r;};
 let m;
 const bc=/beginbfchar([\s\S]*?)endbfchar/g;
 while((m=bc.exec(txt))){
  const re=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]*)>/g; let p;
  while((p=re.exec(m[1]))) map.set(parseInt(p[1],16),hx(p[2]));
 }
 const br=/beginbfrange([\s\S]*?)endbfrange/g;
 while((m=br.exec(txt))){
  const seg=m[1];
  const re=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(?:<([0-9A-Fa-f]*)>|\[([\s\S]*?)\])/g; let p;
  while((p=re.exec(seg))){
   const lo=parseInt(p[1],16), hi=parseInt(p[2],16);
   if(p[3]!==undefined){
    const base=p[3];
    for(let c=lo;c<=hi&&c-lo<65536;c++){
     const v=parseInt(base,16)+(c-lo);
     let h=v.toString(16); while(h.length<base.length)h='0'+h;
     map.set(c,hx(h));
    }
   }else{
    const arr=[...p[4].matchAll(/<([0-9A-Fa-f]*)>/g)].map(x=>hx(x[1]));
    for(let c=lo;c<=hi&&c-lo<arr.length;c++) map.set(c,arr[c-lo]);
   }
  }
 }
 return {map,bytes};
}

/* ══ Αντίστροφος πίνακας γλυφών ══
   Οι γραμματοσειρές-υποσύνολα (subset) που παράγουν ορισμένα προγράμματα
   έχουν ελλιπή ToUnicode: λείπουν κωδικοί που όντως χρησιμοποιούνται, οπότε
   χαρακτήρες όπως Μ, Σ, Γ ή Ν εξαφανίζονταν αθόρυβα από τον τίτλο του έργου
   και από τα ονόματα των ομάδων. Εδώ διαβάζεται ο πίνακας «cmap» της ίδιας
   της ενσωματωμένης γραμματοσειράς (μορφή 4) και αντιστρέφεται σε
   κωδικός γλύφου → Unicode. Με κωδικοποίηση Identity-H ο κωδικός ΕΙΝΑΙ
   ο κωδικός γλύφου, οπότε η αντιστοίχιση είναι άμεση. */
function ttfGidToUnicode(u8){
 const rd16=(o)=>(u8[o]<<8)|u8[o+1];
 const rd32=(o)=>((u8[o]<<24)|(u8[o+1]<<16)|(u8[o+2]<<8)|u8[o+3])>>>0;
 const out=new Map();
 try{
  let off=0;
  if(rd32(0)===0x74746366) off=rd32(12);          // ttcf: πρώτη γραμματοσειρά
  const numTables=rd16(off+4);
  let cmapOff=0;
  for(let i=0;i<numTables;i++){
   const rec=off+12+i*16;
   const tag=String.fromCharCode(u8[rec],u8[rec+1],u8[rec+2],u8[rec+3]);
   if(tag==='cmap'){ cmapOff=rd32(rec+8); break; }
  }
  if(!cmapOff||cmapOff+4>u8.length) return out;
  const n=rd16(cmapOff+2);
  let best=0;
  for(let i=0;i<n;i++){
   const p=cmapOff+4+i*8, pid=rd16(p), eid=rd16(p+2), sub=cmapOff+rd32(p+4);
   if(sub+4>u8.length) continue;
   if(rd16(sub)!==4) continue;                    // δεχόμαστε μόνο μορφή 4
   if((pid===3&&(eid===1||eid===0))||pid===0){ best=sub; if(pid===3&&eid===1)break; }
  }
  if(!best) return out;
  const segX2=rd16(best+6), seg=segX2>>1;
  const endO=best+14, startO=endO+segX2+2, deltaO=startO+segX2, rangeO=deltaO+segX2;
  for(let i=0;i<seg;i++){
   const end=rd16(endO+i*2), start=rd16(startO+i*2);
   const delta=rd16(deltaO+i*2), ro=rd16(rangeO+i*2);
   if(start>end||end===0xFFFF&&start===0xFFFF) continue;
   for(let c=start;c<=end&&c-start<65536;c++){
    let g;
    if(ro===0) g=(c+delta)&0xFFFF;
    else{
     const gi=rangeO+i*2+ro+(c-start)*2;
     if(gi+1>=u8.length) continue;
     g=rd16(gi); if(g) g=(g+delta)&0xFFFF;
    }
    if(g&&!out.has(g)) out.set(g,String.fromCharCode(c));
   }
  }
 }catch(e){}
 return out;
}

/* ── συμβολοσειρές ρεύματος περιεχομένου ── */
function pdfStrings(seg){ // επιστρέφει πίνακα από κωδικούς bytes
 const out=[];
 for(let i=0;i<seg.length;i++){
  const ch=seg[i];
  if(ch==='('){
   const b=[]; let d=1; i++;
   for(;i<seg.length;i++){
    const c=seg[i];
    if(c==='\\'){
     const n=seg[++i];
     const esc={'n':10,'r':13,'t':9,'b':8,'f':12,'(':40,')':41,'\\':92}[n];
     if(esc!==undefined) b.push(esc);
     else if(n>='0'&&n<='7'){let o=n;while(o.length<3&&seg[i+1]>='0'&&seg[i+1]<='7')o+=seg[++i];b.push(parseInt(o,8));}
     else if(n==='\n'){} else b.push(n.charCodeAt(0));
    }
    else if(c==='('){d++;b.push(40);}
    else if(c===')'){d--;if(!d)break;b.push(41);}
    else b.push(c.charCodeAt(0));
   }
   out.push(b);
  }else if(ch==='<'&&seg[i+1]!=='<'){
   const e=seg.indexOf('>',i); if(e<0)break;
   const h=seg.slice(i+1,e).replace(/[^0-9A-Fa-f]/g,'');
   const b=[]; for(let k=0;k<h.length;k+=2) b.push(parseInt(h.substr(k,2)||'0',16));
   out.push(b); i=e;
  }
 }
 return out;
}
function runOf(codes,font){
 const step=(font&&font.bytes===2)?2:1;
 let s='',w=0,n=0,sp=0;
 for(let i=0;i+step-1<codes.length;i+=step){
  const c=step===2?((codes[i]<<8)|codes[i+1]):codes[i];
  if(font&&font.map.size){
   if(font.map.has(c)) s+=font.map.get(c);
   else if(font.gid&&font.gid.has(c)) s+=font.gid.get(c);      // εφεδρεία από τον πίνακα γλυφών
   else if(step===2){ s+='\uFFFD'; if(font)font.miss=(font.miss||0)+1; }
   else s+=String.fromCharCode(c);
  }
  else if(font&&font.gid&&font.gid.has(c)) s+=font.gid.get(c);
  else s+=String.fromCharCode(c);
  w+=(font&&font.widths.has(c))?font.widths.get(c):(font?font.dw:500);
  n++; if(c===32) sp++;
 }
 return {s,w,n,sp};
}

/* ── κύρια εξαγωγή ── */
/* Η ανάγνωση PDF είναι βαριά (δεκάδες δευτερόλεπτα σε πολυσέλιδο αρχείο).
   Χωρίς αυτό η σελίδα «παγώνει» χωρίς καμία ένδειξη. Εδώ η επεξεργασία
   αποδίδει τον έλεγχο στη διεπαφή ανά βήμα, ώστε να ζωγραφίζεται η πρόοδος. */
let pdfProgress=null;
const yieldUI=()=>new Promise(r=>setTimeout(r,0));
async function step(done,total,what){
 if(pdfProgress) pdfProgress(done,total,what);
 await yieldUI();
}
async function pdfToText(arrayBuffer){
 const u8=new Uint8Array(arrayBuffer);
 if(bin(u8.subarray(0,5))!=='%PDF-') throw new Error('Το αρχείο δεν είναι PDF.');
 let {s,objs}=pdfObjects(u8);

 // ρεύματα αντικειμένων (PDF 1.5+)
 for(const o of [...objs.values()]){
  if(!/\/Type\s*\/ObjStm/.test(dictOf(o.body))) continue;
  const data=await rawStream(u8,s,o); if(!data) continue;
  const txt=bin(data), d=dictOf(o.body);
  const N=+(d.match(/\/N\s+(\d+)/)||[])[1]||0;
  const first=+(d.match(/\/First\s+(\d+)/)||[])[1]||0;
  const head=txt.slice(0,first).trim().split(/\s+/).map(Number);
  for(let i=0;i<N;i++){
   const num=head[i*2], off=head[i*2+1];
   if(num==null||off==null) continue;
   const nxt=(i+1<N)?first+head[i*2+3]:txt.length;
   objs.set(num,{num,start:0,end:0,body:txt.slice(first+off,nxt),inline:true});
  }
 }

 // γραμματοσειρές: όνομα πόρου → ToUnicode
 const fonts=new Map();
 const fontObj=new Map();
 const gidCache=new Map();
 await step(1,4,'ανάγνωση γραμματοσειρών');
 const arrOf=t=>{const a=t.trim().split(/\s+/).map(Number);return a;};
 const parseW=(txt,map)=>{ // /W [ c [w w ...]  c1 c2 w ... ]
  const tk=txt.match(/\[[^\]]*\]|[-+]?[\d.]+/g)||[]; let i=0;
  while(i<tk.length){
   const a=parseFloat(tk[i]);
   if(tk[i+1]&&tk[i+1][0]==='['){ arrOf(tk[i+1].slice(1,-1)).forEach((w,k)=>{if(!isNaN(w))map.set(a+k,w);}); i+=2; }
   else { const b=parseFloat(tk[i+1]), w=parseFloat(tk[i+2]);
          if(!isNaN(b)&&!isNaN(w)) for(let c=a;c<=b&&c-a<65536;c++) map.set(c,w);
          i+=3; }
  }
 };
 for(const o of objs.values()){
  const d=dictOf(o.body);
  if(!/\/Type\s*\/Font/.test(d)) continue;
  const f={map:new Map(),bytes:/\/(Encoding\s*\/Identity-[HV]|Type\s*\/Type0)/.test(d)?2:1,
           widths:new Map(),dw:500};
  const tu=d.match(/\/ToUnicode\s+(\d+)\s+\d+\s+R/);
  if(tu&&objs.has(+tu[1])){
   const t=objs.get(+tu[1]);
   const data=t.inline?null:await rawStream(u8,s,t);
   if(data){const c=parseCMap(bin(data)); f.map=c.map; f.bytes=c.bytes;}
  }
  // απλές γραμματοσειρές
  const fc=+(d.match(/\/FirstChar\s+(\d+)/)||[])[1];
  let wArr=null;
  const wm=d.match(/\/Widths\s*\[([^\]]*)\]/);
  if(wm) wArr=arrOf(wm[1]);
  else { const wr=d.match(/\/Widths\s+(\d+)\s+\d+\s+R/);
         if(wr&&objs.has(+wr[1])){const a=objs.get(+wr[1]).body.match(/\[([\s\S]*?)\]/); if(a) wArr=arrOf(a[1]);} }
  if(wArr&&!isNaN(fc)) wArr.forEach((w,i)=>{ if(!isNaN(w)) f.widths.set(fc+i,w); });
  const mw=d.match(/\/MissingWidth\s+([\d.]+)/); if(mw) f.dw=parseFloat(mw[1]);
  // σύνθετες γραμματοσειρές
  const df=d.match(/\/DescendantFonts\s*\[?\s*(\d+)\s+\d+\s+R/);
  if(df&&objs.has(+df[1])){
   const dd=dictOf(objs.get(+df[1]).body);
   const dw=dd.match(/\/DW\s+([\d.]+)/); f.dw=dw?parseFloat(dw[1]):1000;
   const W=dd.match(/\/W\s*\[([\s\S]*?)\]\s*(?:\/[A-Za-z]|>>)/);
   if(W) parseW(W[1],f.widths);
   /* Εφεδρεία για ελλιπή ToUnicode: ο πίνακας γλυφών της ίδιας της
      ενσωματωμένης γραμματοσειράς. Διαβάζεται μόνο όταν χρειάζεται. */
   /* Δεκτά και FontFile2 (TrueType) και FontFile3 (OpenType/CFF): και τα δύο
      φέρουν πίνακα cmap στην ίδια δομή sfnt. */
   const fd=dd.match(/\/FontDescriptor\s+(\d+)\s+\d+\s+R/);
   if(fd&&objs.has(+fd[1])){
    const ff=dictOf(objs.get(+fd[1]).body).match(/\/FontFile([23])?\s+(\d+)\s+\d+\s+R/);
    if(ff&&objs.has(+ff[2])){
     const fo=objs.get(+ff[2]);
     if(!fo.inline){
      /* Η ίδια γραμματοσειρά δηλώνεται ξανά σε κάθε σελίδα· ο πίνακας γλυφών
         της υπολογίζεται μία φορά και επαναχρησιμοποιείται. */
      if(gidCache.has(+ff[2])) { const g=gidCache.get(+ff[2]); if(g&&g.size) f.gid=g; }
      else{
       try{ const prog=await rawStream(u8,s,fo);
            const g=prog?ttfGidToUnicode(prog):null;
            gidCache.set(+ff[2],g);
            if(g&&g.size) f.gid=g; }catch(e){ gidCache.set(+ff[2],null); }
      }
     }
    }
   }
  }
  fontObj.set(o.num,f);
 }
 for(const o of objs.values()){
  const d=dictOf(o.body);
  const fr=d.match(/\/Font\s*<<([\s\S]*?)>>/);
  if(!fr) continue;
  const re=/\/([A-Za-z0-9#+._-]+)\s+(\d+)\s+\d+\s+R/g; let m;
  while((m=re.exec(fr[1]))) if(fontObj.has(+m[2])) fonts.set(m[1],fontObj.get(+m[2]));
 }

 /* Ρεύματα περιεχομένου. Τα αντικείμενα σελίδας δηλώνουν ρητά ποια είναι
    με το /Contents· χωρίς αυτόν τον θετικό έλεγχο, τα ενσωματωμένα προγράμματα
    γραμματοσειρών (FontFile2) περνούν ως κείμενο, γιατί το δυαδικό τους
    περιεχόμενο τυχαίνει να περιέχει τις ακολουθίες BT και Tj. */
 const contentRefs=new Set();
 const addRef=t=>{ const m=/^(\d+)\s+\d+\s+R$/.exec(t.trim()); if(m) contentRefs.add(+m[1]); };
 for(const o of objs.values()){
  const d=dictOf(o.body);
  if(!/\/Type\s*\/Page(?![sA-Za-z])/.test(d)) continue;
  const c=d.match(/\/Contents\s*(\d+\s+\d+\s+R)/);
  if(c){ addRef(c[1]); continue; }
  const ca=d.match(/\/Contents\s*\[([^\]]*)\]/);
  if(ca) (ca[1].match(/\d+\s+\d+\s+R/g)||[]).forEach(addRef);
 }
 const runs=[]; let page=0;
 const total=contentRefs.size;
 await step(2,4,'ανάγνωση σελίδων');
 const nums=[...objs.keys()].sort((a,b)=>a-b);
 for(const n of nums){
  const o=objs.get(n); if(o.inline) continue;
  const d=dictOf(o.body);
  if(contentRefs.size){ if(!contentRefs.has(n)) continue; }
  else if(/\/Length1\s+\d+|\/Subtype\s*\/(Type1C|CIDFontType0C|OpenType)/.test(d)) continue;
  if(/\/Type\s*\/(Font|XObject|Metadata|ObjStm|XRef)/.test(d)) continue;
  const data=await rawStream(u8,s,o); if(!data) continue;
  const txt=bin(data);
  if(!/\bBT\b/.test(txt)||!/\b(Tj|TJ)\b/.test(txt)) continue;
  page++;
  extractRuns(txt,fonts,page,runs);
  if(page%3===0) await step(page,total,'σελίδα '+page+(total?' από '+total:''));
 }
 if(!runs.length) throw new Error('Δεν βρέθηκε αναγνώσιμο κείμενο. Το PDF μπορεί να είναι σαρωμένη εικόνα.');

 // ομαδοποίηση σε γραμμές
 runs.sort((a,b)=> a.pg-b.pg || b.y-a.y || a.x-b.x);
 const lines=[]; let cur=null;
 for(const r of runs){
  if(!r.t.length) continue;
  if(!cur||cur.pg!==r.pg||Math.abs(cur.y-r.y)>4){ cur={pg:r.pg,y:r.y,parts:[]}; lines.push(cur); }
  cur.parts.push(r);
 }
 lines.forEach(L=>L.parts.sort((a,b)=>a.x-b.x));

 // Απόδοση σε κείμενο με διατήρηση των στηλών: η θέση κάθε τμήματος μετριέται
 // σε μονάδες PDF και μετατρέπεται σε χαρακτήρες με ενιαίο βήμα ανά σελίδα.
 const fss=runs.map(r=>r.fs).filter(v=>v>0).sort((a,b)=>a-b);
 const medFs=fss.length?fss[Math.floor(fss.length/2)]:9;
 const U=Math.max(2,medFs*0.5);
 const leftOf={};
 runs.forEach(r=>{ if(leftOf[r.pg]==null||r.x<leftOf[r.pg]) leftOf[r.pg]=r.x; });

 return lines.map(L=>{
  const left=leftOf[L.pg]||0;
  let out='', curX=null;
  for(const p of L.parts){
   const fs=Math.max(3,p.fs||medFs);
   if(curX===null){
    out=' '.repeat(Math.max(0,Math.min(140,Math.round((p.x-left)/U))));
   }else{
    const gap=p.x-curX;
    if(gap<fs*0.18){}
    else if(gap<fs*0.85) out+=' ';
    else out+=' '.repeat(Math.min(90,Math.max(2,Math.round(gap/U))));
   }
   out+=p.t; curX=p.x+p.w;
  }
  return out.replace(/\s+$/,'');
 }).join('\n');
}

function extractRuns(txt,fonts,pg,out){
 let Tm=[1,0,0,1,0,0], Tlm=Tm.slice(), TL=0, font=null, fs=1, Tc=0, Tw=0, Th=1;
 /* Ο πίνακας μετασχηματισμού της σελίδας: χωρίς αυτόν, σελίδες που
    σχεδιάζονται με αναστροφή αξόνων διαβάζονται ανάποδα. */
 let CTM=[1,0,0,1,0,0]; const gs=[];
 const mul=(a,b)=>[a[0]*b[0]+a[1]*b[2], a[0]*b[1]+a[1]*b[3], a[2]*b[0]+a[3]*b[2],
                   a[2]*b[1]+a[3]*b[3], a[4]*b[0]+a[5]*b[2]+b[4], a[4]*b[1]+a[5]*b[3]+b[5]];
 const tok=txt.match(/\[[^\]]*\]|\((?:\\.|[^\\()]|\([^)]*\))*\)|<[0-9A-Fa-f\s]*>|\/[^\s/<>\[\]()]+|[-+]?[\d.]+|[A-Za-z'"*]+/g)||[];
 let st=[];
 const num=i=>parseFloat(st[st.length+i])||0;
 for(let i=0;i<tok.length;i++){
  const t=tok[i];
  if(/^(Tj|TJ|'|")$/.test(t)){
   const seg=st[st.length-1]||'';
   if(t==="'"||t==='"'){ Tlm=mul([1,0,0,1,0,-TL],Tlm); Tm=Tlm.slice(); }
   let s='', adv=0;
   if(t==='TJ'){
    const parts=seg.match(/\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]*>|[-+]?[\d.]+/g)||[];
    for(const q of parts){
     if(q[0]==='('||q[0]==='<'){
      const r=runOf(pdfStrings(q)[0]||[],font);
      s+=r.s; adv+=(r.w/1000)*fs+r.n*Tc+r.sp*Tw;
     }else{
      const a=parseFloat(q)||0;
      adv+=-(a/1000)*fs;
      if(a<-180) s+=' ';
     }
    }
   }else{
    for(const c of pdfStrings(seg)){ const r=runOf(c,font); s+=r.s; adv+=(r.w/1000)*fs+r.n*Tc+r.sp*Tw; }
   }
   s=s.replace(/\s+([.,;:)\]])/g,'$1').replace(/([(\[])\s+/g,'$1').replace(/\s{2,}/g,' ');
   if(s.trim()){
    const M=mul(Tm,CTM);
    const sy=Math.hypot(M[2],M[3])||1, sx=Math.hypot(M[0],M[1])||1;
    out.push({pg,x:M[4],y:M[5],t:s,fs:Math.abs(fs*sy)||fs,w:adv*Th*sx});
   }
   Tm=mul([1,0,0,1,adv*Th,0],Tm);
   st=[]; continue;
  }
  if(t==='Tf'){ const n=(st[st.length-2]||'').replace(/^\//,''); fs=parseFloat(st[st.length-1])||1;
   font=fonts.get(n)||null; st=[]; continue; }
  if(t==='Tc'){ Tc=num(-1); st=[]; continue; }
  if(t==='Tw'){ Tw=num(-1); st=[]; continue; }
  if(t==='Tz'){ Th=(num(-1)||100)/100; st=[]; continue; }
  if(t==='Td'){ Tlm=mul([1,0,0,1,num(-2),num(-1)],Tlm); Tm=Tlm.slice(); st=[]; continue; }
  if(t==='TD'){ TL=-num(-1); Tlm=mul([1,0,0,1,num(-2),num(-1)],Tlm); Tm=Tlm.slice(); st=[]; continue; }
  if(t==='Tm'){ Tlm=[num(-6),num(-5),num(-4),num(-3),num(-2),num(-1)]; Tm=Tlm.slice(); st=[]; continue; }
  if(t==='T*'){ Tlm=mul([1,0,0,1,0,-TL],Tlm); Tm=Tlm.slice(); st=[]; continue; }
  if(t==='TL'){ TL=num(-1); st=[]; continue; }
  if(t==='BT'){ Tm=[1,0,0,1,0,0]; Tlm=Tm.slice(); Tc=0; Tw=0; Th=1; st=[]; continue; }
  if(t==='cm'){ CTM=mul([num(-6),num(-5),num(-4),num(-3),num(-2),num(-1)],CTM); st=[]; continue; }
  if(t==='q'){ gs.push(CTM.slice()); st=[]; continue; }
  if(t==='Q'){ if(gs.length)CTM=gs.pop(); st=[]; continue; }
  if(/^[A-Za-z]{1,3}\*?$/.test(t)&&!/^(true|false|null)$/.test(t)){ st=[]; continue; }
  st.push(t);
  if(st.length>12) st.shift();
 }
}

<script>
/* ══════════════════════════════════════════════════════════════
   ΦΥΛΛΑ EXCEL
   Ανάγνωση .xlsx και παραγωγή πολυφύλλου βιβλίου, χωρίς εξωτερική
   βιβλιοθήκη. Το .xlsx είναι αρχείο ZIP· η αποσυμπίεση γίνεται με
   το DecompressionStream και η συμπίεση παραλείπεται (εγγραφές
   αποθήκευσης), που το Excel δέχεται κανονικά.
   ══════════════════════════════════════════════════════════════ */
const LE=new TextEncoder(), LD=new TextDecoder('utf-8');
const rd16=(b,o)=>b[o]|b[o+1]<<8;
const rd32=(b,o)=>(b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0;

async function unzip(buf){

 for(let i=b.length-22;i>=Math.max(0,b.length-66000);i--){
  if(b[i]===0x50&&b[i+1]===0x4b&&b[i+2]===0x05&&b[i+3]===0x06){eocd=i;break;}

  if(rd32(b,p)!==0x02014b50) break;

        elen=rd16(b,p+30), clen=rd16(b,p+32), lho=rd32(b,p+42);
  const name=LD.decode(b.subarray(p+46,p+46+nlen));
  const ln=rd16(b,lho+26), le=rd16(b,lho+28);
  const start=lho+30+ln+le;
  let data=b.subarray(start,start+csize);
  if(method===8){
   const ds=new DecompressionStream('deflate-raw');

   eliUsed+=o.minusUsed;
   o.pct20=o.budG?o.minusAsked/o.budG*100:0;
   if(o.pct20>max20)max20=o.pct20;
   over20+=o.over20;
 });
 eliUsed=R2(eliUsed); over20=R2(over20);
 const pct10=conGE?transfer/conGE*100:0;
 const eliUnused=R2(minus-eliUsed);
 const aprNeed=R2(Math.max(0,plus-eliUsed)+newc);
 const aprApeRaw=R2(aprCon-aprNeed);
 const shortfall=aprApeRaw<0?R2(-aprApeRaw):0;
 const aprApe=aprApeRaw<0?0:aprApeRaw;

 const symCon=R2(conGE+aprCon);
 const symApe=R2(apeGE+aprApe);
 const symDelta=R2(symApe-symCon);
 const symPct=symCon?symDelta/symCon*100:0;

 const apol=Number(pr.apologistika)||0;
 const anathCon=Number(pr.anathProv)||0;
 const anathApe=anathTotal();
 const netCon=R2(symCon+apol+anathCon), netApe=R2(symApe+apol+anathApe);
 const fpaCon=R2(netCon*v), fpaApe=R2(netApe*v);
 const totCon=R2(netCon+fpaCon), totApe=R2(netApe+fpaApe);

 const anyNew=G.some(o=>o.hasNew), anyZero=G.reduce((a,o)=>a+o.zeroed,0);
 const killed=G.filter(o=>o.bud>0&&o.ape===0).map(o=>o.name);
 /* Γνωμοδότηση Τεχνικού Συμβουλίου: σε κάθε χρήση «επί έλασσον» δαπανών
    (άρθρο 156 §3γ΄, τελευταίο εδάφιο) και σε κάθε μεταβολή του συμβατικού
    ποσού — αύξηση ή μείωση. */
 const tsNeeded=eliUsed>0||Math.abs(symDelta)>0.005;
 const pct15=symCon?symDelta/symCon*100:0;
 const hasPrev=(S.versions||[]).length>0;

 return{e,u,v,G,budW:R2(budW),conWorks,apeWorks,prevWorks,conGE,apeGE,prevGE,
  plus,minus,newc,aprCon,eliUsed,eliUnused,aprNeed,aprApe,shortfall,
  symCon,symApe,symDelta,symPct,max20,over20,transfer,pct10,totInc,totDec,
  apol,anathCon,anathApe,netCon,netApe,fpaCon,fpaApe,totCon,totApe,
  anyNew,anyZero,killed,tsNeeded,pct15,hasPrev,
  aprPct:aprCon?aprNeed/aprCon*100:0};
}

/* ════════════════ ΑΝΑΘΕΩΡΗΣΗ ════════════════ */
function periodNu(idx){
 // ν = 1 για την πρώτη αναθεωρητική περίοδο μετά το παράθυρο σταθερότητας
 return idx+1;
}
function sigmaOf(nu){
 const s1=Number(S.anath.sigma1)||0.07;
 return Math.min(R2((s1+0.01*nu)*100)/100,0.20);
}
function stabilityQuarters(){
 // παρ.5 άρθρου 153: σταθερότητα στο τρίμηνο εκκίνησης + το επόμενο,
 // εκτός αν ο προϋπολογισμός δημοπράτησης ≥ 1.500.000 € χωρίς ΦΠΑ
 return (Number(S.project.proypDimopr)||0)>=1500000?1:2;
}
function quarterLabel(y,q){return QUARTERS[q]+' '+y;}
function addQuarters(y,q,n){let Y=y,Q=q;for(let i=0;i<n;i++){Q++;if(Q>3){Q=0;Y++;}}return[Y,Q];}
function autoLabel(idx){
 const y=parseInt(S.anath.ekkY),q=Number(S.anath.ekkQ);
 if(!y&&y!==0)return'';
 const [Y,Q]=addQuarters(y,q,stabilityQuarters()+idx);
 return quarterLabel(Y,Q);
}
function periodCalc(p,idx){
 const e=(S.project.geoe||0)/100;
 const nu=p.nuManual?Number(p.nu)||1:periodNu(idx);
 const sg=p.sigmaManual?Number(p.sigma)||0:sigmaOf(nu);
 let base=0,rev=0;
 S.groups.forEach(g=>{
   const f=1-(g.discount||0)/100;
   let b=0,r=0;
   g.items.forEach(it=>{
     const q=Number((p.q||{})[it.id])||0; if(!q)return;
     const price=Number(it.timi)||0;
     const c=Number((p.coef||{})[it.kodAnath||'—']);
     const co=(c&&c>0)?c:1;
     b+=R2(q*price); r+=R2(q*price*co);
   });
   base+=R2(R2(b)*f); rev+=R2(R2(r)*f);
 });
 const bG=R2(R2(base)*(1+e)), rG=R2(R2(rev)*(1+e));
 // υλικά επί τόπου (θετική πίστωση) / αντιλογισμός (αρνητική)
 let mb=0,mr=0;
 (p.materials||[]).forEach(m=>{
   const val=Number(m.value)||0, co=Number(m.coef)||1;
   mb+=val; mr+=R2(val*co);
 });
 const dW=R2((rG-bG)*(1-sg));
 const dM=R2((R2(mr)-R2(mb))*(1-sg));
 return{nu,sigma:sg,base:bG,rev:rG,dW,mbase:R2(mb),mrev:R2(mr),dM,total:R2(dW+dM)};
}
function anathTotal(){
 if(!S.anath||!S.anath.periods)return 0;
 let t=0; S.anath.periods.forEach((p,i)=>{t+=periodCalc(p,i).total;});
 return R2(t);
}
function allRevCodes(){
 const s=new Set();
 S.groups.forEach(g=>g.items.forEach(it=>{if(it.kodAnath)s.add(it.kodAnath);}));
 return[...s].sort();
}

     <input class="num" placeholder="Αν/Αο" value="${m.coef??''}" oninput="setMat(${i},${mi},'coef',this.value,1)" style="flex:1">
     <button class="btn dgr" onclick="delMat(${i},${mi})">✕</button></div>`).join('')}
   <button class="btn gh sm" onclick="addMat(${i})">＋ Γραμμή υλικών</button>

    <div class="kv hi"><span class="k">Σύνολο περιόδου</span><span class="v">${F(r.total)}</span></div>
   </div>
  </div></div>`;
 }).join('');

 return`<h2 class="pt">Αναθεώρηση τιμών</h2>
 <p class="pd">Ορίστε τον χρόνο εκκίνησης και προσθέστε μία περίοδο για κάθε τρίμηνο στο οποίο εκτελέστηκαν εργασίες. Το ν και το σ υπολογίζονται αυτόματα από τον νόμο· μπορείτε να τα υπερβείτε χειροκίνητα.</p>
 <div class="card"><h3><span class="pill">⚙</span>Παράμετροι αναθεώρησης</h3><div class="cb">
  <div class="grid g4">
   <label class="f"><span>Έτος εκκίνησης</span><input class="num" type="number" value="${E(S.anath.ekkY)}" oninput="setv('anath.ekkY',this.value,1)"></label>
   <label class="f"><span>Τρίμηνο εκκίνησης</span><select onchange="setv('anath.ekkQ',this.value,1)">
     ${QUARTERS.map((q,i)=>`<option value="${i}" ${Number(S.anath.ekkQ)===i?'selected':''}>${q}</option>`).join('')}</select></label>
   <label class="f"><span>σ₁</span><input class="num" type="text" value="${S.anath.sigma1}" oninput="setv('anath.sigma1',this.value,1)">

   <div style="align-self:end"><button class="btn c6" onclick="addPeriod()">＋ Προσθήκη περιόδου</button></div>

  <div class="note" style="margin-top:14px" id="stabNote">Ο προϋπολογισμός δημοπράτησης είναι <b>${F(S.project.proypDimopr)} €</b> χωρίς Φ.Π.Α., άρα οι τιμές παραμένουν σταθερές
   <b>${stab===2?'στο τρίμηνο εκκίνησης και στο αμέσως επόμενο':'μόνο στο τρίμηνο εκκίνησης'}</b> (άρθρο 153 §5).
   Η πρώτη αναθεωρητική περίοδος (ν = 1) είναι επομένως το <b>${autoLabel(0)||'—'}</b>.</div>
 </div></div>
 ${list||'<div class="card"><div class="empty"><b>Καμία περίοδος</b>Προσθέστε μία περίοδο για κάθε τρίμηνο εκτέλεσης εργασιών.</div></div>'}
 <div class="card"><h3><span class="pill">Σ</span>Συγκεντρωτικός πίνακας δαπάνης αναθεώρησης</h3>
  <table class="t"><thead><tr><th>Περίοδος</th><th class="c">ν</th><th class="c">σ</th>
   <th class="n">Δαπάνη που αναθεωρείται</th><th class="n">Αναθεωρημένη</th><th class="n">Δαπάνη αναθεώρησης</th></tr></thead><tbody>

  <tr class="tot"><td colspan="5">ΣΥΝΟΛΙΚΗ ΔΑΠΑΝΗ ΑΝΑΘΕΩΡΗΣΗΣ</td><td class="n">${F(anathTotal())}</td></tr>
  </tbody></table></div>`;

function chk(ok,txt){return`<span class="st ${ok===null?'na':(ok===true?'ok':(ok==='w'?'warn':'bad'))}"><b></b>${txt}</span>`;}
function vCheck(){
 const c=calc(),p=S.project;
 const rows=[];
 const add=(ref,q,st,note)=>rows.push(`<tr><td style="width:96px"><span class="tag">${ref}</span></td>
   <td>${q}</td><td style="width:200px">${st}</td><td style="width:250px" class="hint">${note||''}</td></tr>`);

 add('§3β΄','Το κονδύλι απροβλέπτων αντιστοιχεί στο σωστό ποσοστό',
  chk(p.apr==9||p.apr==15?true:'w',F(p.apr)+'% του συμβατικού'),
  '9% για έργα άνω των ενωσιακών ορίων, 15% για τα υπόλοιπα.');
 add('§3β΄','Επάρκεια του κονδυλίου απροβλέπτων',
  chk(c.shortfall?false:true,c.shortfall?('Έλλειμμα '+F(c.shortfall)+' €'):('Σε χρήση '+P(c.aprPct))),
  c.shortfall?'Το ακάλυπτο ποσό απαιτεί τροποποίηση της σύμβασης.':'Απομένουν '+F(c.aprApe)+' €.');
 add('§3β΄','Διατήρηση του «βασικού σχεδίου»',
  chk(c.anyZero?'w':true,c.anyZero?(c.anyZero+' άρθρα μηδενίζονται'):'Δεν μηδενίζεται άρθρο'),
  c.anyZero?'Ο μηδενισμός άρθρων τίθεται υπόψη του Τεχνικού Συμβουλίου ως ζήτημα βασικού σχεδίου.':'');
 add('§3γα΄','Ρητή πρόβλεψη «επί έλασσον» στα συμβατικά τεύχη',
  c.eliUsed?chk(null,'Ελέγχεται στην Ε.Σ.Υ.'):chk(null,'Δεν τίθεται'),
  c.eliUsed?'Αν η διακήρυξη δεν το προβλέπει, η ανακατανομή δεν επιτρέπεται καθόλου.':'');
 add('§3γβ΄','Δεν καταργείται ομάδα εργασιών',
  chk(c.killed.length?false:true,c.killed.length?('Καταργείται: '+c.killed.join(', ')):'Καμία κατάργηση'),'');
 add('§3γδ΄','Οι «επί έλασσον» δεν πληρώνουν νέες εργασίες',
  chk(c.anyNew&&c.eliUsed?'w':true,c.anyNew?'Υπάρχουν νέες εργασίες':'Καμία νέα εργασία'),
  c.anyNew?'Οι νέες εργασίες καλύπτονται μόνο από απρόβλεπτα ή τροποποίηση.':'');
 add('§3γε΄','Όριο 20% ανά ομάδα εργασιών',
  chk(c.max20>20?false:(c.max20>17?'w':true),'Μέγιστο '+P(c.max20)),
  c.over20?('Υπέρβαση '+F(c.over20)+' €. Το υπερβάλλον μειώνει την αξία της σύμβασης.'):'Όριο 20%.');
 add('§3γε΄','Όριο 10% αθροιστικά',
  chk(c.pct10>10?false:(c.pct10>8?'w':true),P(c.pct10)),
  'Μετρούν μόνο οι μεταφορές δαπάνης μεταξύ ομάδων: '+F(c.transfer)+' €.');
 add('§3γ΄','Σύμφωνη γνώμη Τεχνικού Συμβουλίου',
  chk(c.eliUsed?false:true,c.eliUsed?'ΑΠΑΙΤΕΙΤΑΙ':'Δεν απαιτείται για τον λόγο αυτό'),
  c.eliUsed?('Χρήση «επί έλασσον» '+F(c.eliUsed)+' €. Η διάταξη λέει «σε κάθε περίπτωση».'):'');
 /* Ο μετρητής χρησιμοποιεί την απόλυτη τιμή, οπότε μια ουσιώδης ΜΕΙΩΣΗ του
    συμβατικού ποσού τον έβαφε κόκκινο ενώ το φύλλο ελέγχου δήλωνε «Καμία
    τροποποίηση». Και τα δύο δείχνουν πλέον το ίδιο μέγεθος. */
 add('§3α΄','Τροποποίηση εντός του ορίου 15%',
  Math.abs(c.symDelta)>0.005
    ? chk(Math.abs(c.pct15)>15?false:'w',(c.symDelta>0?'Αύξηση ':'Μείωση ')+P(Math.abs(c.pct15)))
    : chk(true,'Καμία τροποποίηση'),
  Math.abs(c.symDelta)>0.005
    ? (c.symDelta>0?'Απαιτείται και γνώμη Τεχνικού Συμβουλίου, καθώς και τήρηση των ορίων του άρθρου 5.'
                   :'Μείωση του συμβατικού ποσού κατά '+F(-c.symDelta)+' €. Τεκμηριώνεται με τον ίδιο τρόπο.')
    : '');
 add('§5','Πρωτόκολλο νέων τιμών',
  chk(c.anyNew?'w':true,c.anyNew?'ΑΠΑΙΤΕΙΤΑΙ Π.Κ.Τ.Μ.Ν.Ε.':'Δεν απαιτείται'),
  c.anyNew?'Τηρήστε την ιεραρχία α΄ → β΄ → γ΄ του άρθρου 156 §5.':'');
 add('§4','Υπολογισμός μεταβολής χωρίς αναθεώρηση και Φ.Π.Α.',
  chk(true,P(c.symPct)),'Η συνολική μεταβολή με Φ.Π.Α. και αναθεώρηση είναι '+P(c.totCon?(c.totApe-c.totCon)/c.totCon*100:0)+' και δεν χρησιμοποιείται για τα όρια.');

 // αναθεώρηση
 let aRows=[];
 const stab=stabilityQuarters();
 aRows.push(`<tr><td><span class="tag">§5</span></td><td>Χρόνος εκκίνησης &amp; παράθυρο σταθερότητας</td>
  <td>${chk(S.anath.ekkY?true:null,S.anath.ekkY?(autoLabel(0)+' = ν 1'):'Δεν ορίστηκε')}</td>
  <td class="hint">Σταθερότητα ${stab===2?'δύο τριμήνων':'ενός τριμήνου'} με βάση προϋπολογισμό ${F(p.proypDimopr)} €.</td></tr>`);
 aRows.push(`<tr><td><span class="tag">§7</span></td><td>Πλαφόν σ = 0,20</td>
  <td>${chk(true,'Εφαρμόζεται αυτόματα')}</td><td class="hint">σ = σ₁ + 0,01·ν, με ανώτατη τιμή 0,20.</td></tr>`);
 let unallocated=0;
 S.groups.forEach(g=>g.items.forEach(it=>{
   let alloc=0;(S.anath.periods||[]).forEach(pp=>{alloc+=Number((pp.q||{})[it.id])||0;});
   if(Math.abs(alloc-(Number(it.posotitaApe)||0))>0.001)unallocated++;

 ${r('Εργασίες με Γ.Ε. &amp; Ο.Ε. '+F(p.geoe)+'%',c.conGE,c.apeGE)}

 }

 if(id==='eis')return docEis(c,D);
 if(id==='ts')return docTS(c,D);

 </table>

 <h3>Ε.2 Σύμφωνη γνώμη Τεχνικού Συμβουλίου</h3>
 <p>${c.eliUsed?`Με τον παρόντα Α.Π.Ε. γίνεται χρήση «επί έλασσον» δαπανών ύψους ${F(c.eliUsed)} €. Κατά το τελευταίο εδάφιο της περ. γ΄ της παρ. 3 του άρθρου 156, για τη χρήση των «επί έλασσον δαπανών» απαιτείται <b>σε κάθε περίπτωση</b> η σύμφωνη γνώμη του οικείου τεχνικού συμβουλίου. Ο Πίνακας παραπέμπεται συνεπώς στο ${E(p.texnikoSymvoulio)} πριν από την έγκρισή του από την Προϊσταμένη Αρχή.`
  :(c.symDelta>0.005?`Το συμβατικό ποσό αυξάνεται κατά ${F(c.symDelta)} €, ήτοι ${P(c.pct15)}. Απαιτείται γνώμη του ${E(p.texnikoSymvoulio)} κατά την περ. ε΄ της παρ. 1 του άρθρου 156.`
  :`Δεν γίνεται χρήση «επί έλασσον» δαπανών και δεν μεταβάλλεται το συμβατικό ποσό. Δεν προκύπτει, από τα ανωτέρω στοιχεία, υποχρέωση γνωμοδότησης του οικείου Τεχνικού Συμβουλίου.`)}</p>

 ${S.anath.periods.length?`<table><tr><th>Περίοδος</th><th class="n">ν</th><th class="n">σ</th><th class="n">Δαπάνη αναθεώρησης</th></tr>
  ${S.anath.periods.map((pp,i)=>{const r=periodCalc(pp,i);
   return`<tr><td>${E(pp.label||autoLabel(i))}</td><td class="n">${r.nu}</td><td class="n">${r.sigma.toFixed(2).replace('.',',')}</td><td class="n">${F(r.total)} €</td></tr>`;}).join('')}
  <tr><td colspan="3"><b>ΣΥΝΟΛΟ ΔΑΠΑΝΗΣ ΑΝΑΘΕΩΡΗΣΗΣ</b></td><td class="n"><b>${F(c.anathApe)} €</b></td></tr></table>`
  :'<p><span class="ph">[συμπληρώστε τις αναθεωρητικές περιόδους στο βήμα 5]</span></p>'}
 <p>Η αναθεώρηση υπολογίζεται για τις εργασίες που εκτελέστηκαν εντός του εγκεκριμένου χρονοδιαγράμματος. Σύμφωνα με την παρ. 4 του άρθρου 156, τα όρια του άρθρου αυτού δεν περιλαμβάνουν την αναθεώρηση τιμών, η οποία συνεπώς δεν προσμετράται στον υπολογισμό της συμβατικής μεταβολής.</p>

  <li>${c.anyNew?'Εισάγονται νέες εργασίες και συντάσσεται Π.Κ.Τ.Μ.Ν.Ε.':'Δεν εισάγονται νέες εργασίες και δεν απαιτείται Π.Κ.Τ.Μ.Ν.Ε.'}</li>

 ${sig2(`<b>Ο ΣΥΝΤΑΞΑΣ – Ο ΕΠΙΒΛΕΠΩΝ</b><br><br><br><br>${ph(p.epivlepwn,'επιβλέπων')}<br>${E(p.epivlepwnEid)}`,

/* ════════════════ ΑΝΑΓΝΩΣΗ ΠΡΟΫΠΟΛΟΓΙΣΜΟΥ ════════════════ */
const SKIP=/^(Σε μεταφορά|Από μεταφορά|Σελίδα|Σύνολο :|Άθροισμα|Προστίθεται|Απρόβλεπτα\s|Απολογιστικά|ΦΠΑ\s|ΓΕΝΙΚΟ ΣΥΝΟΛΟ|Σύνολο σε|Εγκ\.|Οι μελετητές|ΘΕΩΡΗΘΗΚΕ|Η Προϊσταμένη|Ο Αναπληρωτής|\(Ευρώ\)|Δαπάνη|Μερική|Ολική)/i;
const TAIL=/(\d+(?:\.\d{1,3})?)\s+(\S{1,9})\s+([\d.]*\d(?:,\d+)?)\s+([\d.]*\d(?:,\d+)?)\s+([\d.]*\d(?:,\d+)?)\s*$/;
const GRPH=/^(\d{1,2})\.\s+(\S.{2,})$/;
/* Προσοχή: το \b της JavaScript δεν λειτουργεί δίπλα σε ελληνικούς χαρακτήρες,
   γι' αυτό όλες οι αγκυρώσεις γίνονται με κενό ή αρχή γραμμής. */
const REVC=/(?:^|[\s\\])(ΝΑΟΙΚ|ΝΑΗΛΜ|ΝΠΡΣ|ΟΙΚ|ΗΛΜ|ΟΔΝ|ΥΔΡ|ΠΡΣ|ΝΟΔΟ)\s*\.?\s*(\d[\d.]*\s?[Α-Ω]?)(?=\s|$)/g;
/* Δεύτερη γραφή, από παραγωγούς που τυπώνουν τις στήλες κολλητά:
   «ΟΙΚ ΚΠΤ-22.60-ΑΟΙΚ2236=100%». Εδώ ο κωδικός αναθεώρησης δεν έχει κενό
   πριν από τα ψηφία και κλείνει με ποσοστό συμμετοχής. */
const REVC2=/(ΝΑΟΙΚ|ΝΑΗΛΜ|ΝΑΠΡΣ|ΑΤΗΕ|ΟΙΚ|ΗΛΜ|ΟΔΝ|ΥΔΡ|ΠΡΣ)\s*(\d[\d.]*[Α-Ω]?)\s*=\s*\d{1,3}\s*%/g;
/* Τρίτη γραφή, στα Η/Μ άρθρα του ίδιου παραγωγού: ο κωδικός αναθεώρησης
   κολλάει κατευθείαν πάνω στον κωδικό άρθρου — «ΑΤΗΕ 8751.1.3ΗΛΜ 44».
   Απαιτείται ψηφίο ακριβώς πριν από το πρόθεμα, ώστε να μην μπερδεύεται με
   τη συνηθισμένη γραφή «ΝΑΟΙΚ 22.23 ΟΙΚ 2252» που έχει κενό. */
const REVC3=/\d(ΟΙΚ|ΗΛΜ|ΟΔΝ|ΥΔΡ|ΠΡΣ|ΝΟΔΟ)\s+(\d[\d.]*\s?[Α-Ω]?)(?=\s|$)/g;
/* Κωδικός άρθρου της ίδιας γραφής: «ΟΙΚ ΚΠΤ-22.60-Α» ή «ΟΙΚ ΚΠΤ-77.92-ΣΧ». */
const CODE2=/((?:[Α-Ω]{2,5}\s+)?ΚΠΤ\s*-\s*[\dΝ][\d.]*(?:\s*-\s*[Α-Ω]{1,3})?)/;
const PREF=/(?:^|\s)(ΝΑΟΙΚ|ΝΑΗΛΜ|ΝΑΠΡΣ|ΝΑΥΔΡ|ΝΑΟΔΟ|ΝΑΤΕΟ|ΑΤΗΕ|ΝΕΤ)(?=\s|$)/;
const CODE=/(?:^|\s)((?:Ν\\)?\d+(?:\.\d+)+(?:\.[Α-ΩA-Z]{1,3})?|Ν\s?\\\d[\d.]*[Α-ΩA-Z]*|[Α-Ω]{1,3}\d+(?:\.\d+)+)(?=\s|$)/;
const PREF2=/(?:^|\s)(ΑΤΗΕ|ΝΑΟΙΚ|ΝΑΗΛΜ)\s+(Ν?\\?\d[\d.]*)(?=\s|$)/;
const UNITX=/^[a-zA-Zμ]{1,3}$/;


/* ── κεφαλίδα και υποσέλιδο του προϋπολογισμού ── */
const NAMEY=/^[Α-ΩΆΈΉΊΌΎΏ][α-ωά-ώϊϋΐΰ'΄]+(?:\s+[Α-ΩΆΈΉΊΌΎΏ][α-ωά-ώϊϋΐΰ'΄]+){1,2}$/;
const SPEC=/(Μηχανικός|Αρχιτέκτων|Τοπογράφος|Γεωπόνος|Γεωλόγος)/;
function cells(line){
 const out=[]; const re=/\S(?:.*?\S)?(?=\s{4,}|$)/g; let m;
 while((m=re.exec(line))){ if(m[0].trim()) out.push({x:m.index,t:m[0].trim()}); }
 return out;
}
function parseMeta(raw){
 const meta={};
 // ── κεφαλίδα ──
 let stop=raw.findIndex(l=>/ΠΡΟΫΠΟΛΟΓΙΣΜΟΣ\s+(ΜΕΛΕΤΗΣ|ΔΗΜΟΠΡΑΤΗΣΗΣ|ΠΡΟΣΦΟΡΑΣ)/.test(l));
 if(stop<0)stop=Math.min(raw.length,14);
 let ergoX=-1, ergo=[];
 for(let i=0;i<stop;i++){
  for(const c of cells(raw[i])){
   let m;
   if((m=c.t.match(/^ΕΡΓΟ\s*:\s*(.*)$/))){ergoX=c.x;if(m[1].trim())ergo.push(m[1].trim());continue;}
   if(ergoX>=0&&Math.abs(c.x-ergoX)<26&&!/^[Α-Ω]+\s*:/.test(c.t)){ergo.push(c.t);continue;}
   if((m=c.t.match(/^ΔΗΜΟΣ\s*:\s*(.+)$/))){meta.dimos=m[1].trim();continue;}
   if(/^ΕΛΛΗΝΙΚΗ ΔΗΜΟΚΡΑΤΙΑ/.test(c.t)){meta.anathetousa=c.t;continue;}
   if(/^(ΝΟΜΟΣ|ΠΕΡΙΦΕΡΕΙΑ)\s/.test(c.t)){meta.nomos=c.t;continue;}
   if(/^ΔΗΜΟΣ\s+\S/.test(c.t)&&!meta.dimos){meta.dimos=c.t;continue;}
   if(/^(Δ\/ΝΣΗ|ΔΙΕΥΘΥΝΣΗ)/.test(c.t)){meta.dnsi=c.t;continue;}
  }
 }
 if(ergo.length)meta.ergo=ergo.join(' ').replace(/\s+/g,' ').trim();

 // ── υποσέλιδο οικονομικών ──
 let pendApol=false;
 raw.forEach(L0=>{
  const L=L0.replace(/\s+/g,' ').trim(); let m;
  const last=()=>{const q=L.match(/([\d.]*\d,\d{2})\s*$/);return q?gr(q[1]):null;};
  if(pendApol){const v=last();if(v!=null){meta.apol=v;pendApol=false;return;}}
  if(/^Άθροισμα/.test(L)){const v=last();if(v!=null){if(meta.works==null)meta.works=v;meta.lastSum=v;}return;}
  if((m=L.match(/Προστίθεται ΓΕ ?& ?ΟΕ\s*([\d,.]+)\s*%/))){meta.geoe=gr(m[1]);return;}
  if((m=L.match(/^Απρόβλεπτα\s*([\d,.]+)\s*%/))){meta.apr=gr(m[1]);return;}
  if(/Απολογιστικά χωρίς/.test(L)){const v=last();if(v!=null)meta.apol=v;else pendApol=true;return;}
  if(/Πρόβλεψη αναθεώρησης/.test(L)){const v=last();if(v!=null)meta.anath=v;return;}
  if((m=L.match(/^ΦΠΑ\s*([\d,.]+)\s*%/))){meta.fpa=gr(m[1]);return;}
  if(/ΓΕΝΙΚΟ ΣΥΝΟΛΟ/.test(L)){const v=last();if(v!=null)meta.geniko=v;return;}
 });

 // ── υπογραφές ──
 const gi=raw.findIndex(l=>/ΓΕΝΙΚΟ ΣΥΝΟΛΟ/.test(l));
 if(gi>=0){
  const cols=[];
  for(let i=gi;i<raw.length;i++) for(const c of cells(raw[i])){
   const mid=c.x+c.t.length/2;
   let col=cols.find(k=>Math.abs(k.mid-mid)<9);
   if(!col){col={mid,items:[]};cols.push(col);}
   col.items.push(c.t);
  }
  cols.forEach(col=>{
   const blob=col.items.join(' | ');
   const nm=col.items.find(t=>NAMEY.test(t));
   if(!nm)return;
   const sp=col.items.find(t=>SPEC.test(t))||'';
   if(/μελετητ|συντάξ/i.test(blob)&&!meta.meletitis){meta.meletitis=nm;meta.meletitisEid=sp;}
   if(/(Διευθυντής|Προι?στάμενος|Προϊστάμενος)/.test(blob)&&!meta.proist){meta.proist=nm;meta.proistEid=sp;}
  });
 }
 return meta;
}

/* Ο πίνακας του ErgoLand τυπώνει τη γραμμή με τους αριθμούς ΠΡΩΤΗ και συνεχίζει
   την περιγραφή στις επόμενες γραμμές. Ο αναγνώστης προσαρτά κάθε γραμμή χωρίς
   αριθμητική κατάληξη στο άρθρο που προηγήθηκε. */
function parseBudget(txt){
 const raw=txt.split(/\r?\n/);
 const groups=[]; const meta=parseMeta(raw);
 let cur=null, item=null, inHeader=false, justOpened=false, hdrLines=0;

 const close=()=>{
  if(!item)return;
  let t=' '+item._buf.join(' ').replace(/\s+/g,' ').trim()+' ';
  let art='',rev='';
  const rv2=[...t.matchAll(REVC2)];
  if(rv2.length){const m=rv2[rv2.length-1];rev=m[1]+' '+m[2];t=t.replace(m[0],' ');}
  else{
   const rv=[...t.matchAll(REVC)];
   if(rv.length){const m=rv[rv.length-1];rev=m[1]+' '+m[2];t=t.replace(m[0],' ');}
   else{
    const rv3=[...t.matchAll(REVC3)];
    /* Αφαιρείται μόνο ο κωδικός αναθεώρησης· το ψηφίο που τον προηγείται
       ανήκει στον κωδικό άρθρου και επιστρέφεται στο κείμενο. */
    if(rv3.length){const m=rv3[rv3.length-1];rev=m[1]+' '+m[2];t=t.replace(m[0],m[0][0]+' ');}
   }
  }
  const cd2=t.match(CODE2);
  const p2=cd2?null:t.match(PREF2);
  if(cd2){art=cd2[1].replace(/\s+/g,' ').trim();t=t.replace(cd2[0],' ');}
  else if(p2){art=p2[1]+' '+p2[2];t=t.replace(p2[0],' ');}
  else{
   const pf=t.match(PREF);
   if(pf){art=pf[1];t=t.replace(pf[0],' ');}
   const cd=t.match(CODE);
   if(cd){art=(art?art+' ':'')+cd[1];t=t.replace(cd[0],' ');}
  }
  t=t.replace(/^\s*\d+\s+/,'').replace(/\s+/g,' ')
     .replace(/\s+([.,;:)\]])/g,'$1').replace(/([(\[])\s+/g,'$1')
     .replace(/\s[a-zA-Z]\s*$/,'')
     .replace(/^[,.\s\-–]+|[,.\s\-–]+$/g,'').trim();
  item.kodikos=art.trim(); item.kodAnath=rev.trim(); item.perigrafi=t||'(χωρίς περιγραφή)';
  delete item._buf; item=null;
 };

 raw.forEach(L0=>{
  const L=L0.replace(/\s+/g,' ').trim();
  if(!L)return;
  let m;
  if(/ΠΡΟΫΠΟΛΟΓΙΣΜΟΣ\s+(ΜΕΛΕΤΗΣ|ΔΗΜΟΠΡΑΤΗΣΗΣ|ΠΡΟΣΦΟΡΑΣ)/.test(L)){inHeader=true;hdrLines=0;close();return;}
  /* Η κεφαλίδα κλείνει με τη γραμμή [1] [2] … που τυπώνουν κάποιοι παραγωγοί.
     Όσοι δεν την τυπώνουν άφηναν παλιότερα την κεφαλίδα ανοιχτή μέχρι το τέλος
     του αρχείου και χανόταν όλος ο πίνακας· γι' αυτό κλείνει και μόλις
     εμφανιστεί γραμμή άρθρου ή τίτλος ομάδας, και σε κάθε περίπτωση μετά
     από 12 γραμμές. */
  if(inHeader){
   hdrLines++;
   if(/^\[1\]/.test(L)){ inHeader=false; return; }
   if(TAIL.test(L)||GRPH.test(L)||hdrLines>12) inHeader=false;
   else return;
  }
  if(SKIP.test(L)){close();return;}

  const t=L.match(TAIL);
  if(t){
   close();
   if(!cur){cur={id:uid(),name:'Ομάδα 1',discount:0,items:[]};groups.push(cur);}
   item={id:uid(),at:t[1],monada:t[2],posotita:gr(t[3]),timi:gr(t[4]),
         _buf:[L.slice(0,t.index)]};
   item.posotitaApe=item.posotita;
   cur.items.push(item); justOpened=true; return;
  }
  if((m=L.match(GRPH))&&!/\d,\d/.test(L)){
   close();
   cur={id:uid(),name:m[2].trim(),discount:0,items:[]};groups.push(cur);justOpened=false;return;
  }
  if(item){
   if(justOpened&&UNITX.test(L)){item.monada+=L;justOpened=false;return;}
   item._buf.push(L); justOpened=false;
  }
 });
 close();
 const gs=groups.filter(g=>g.items.length);
 let sum=0; gs.forEach(g=>g.items.forEach(it=>{sum+=R2((Number(it.posotita)||0)*(Number(it.timi)||0));}));
 meta.parsedWorks=R2(sum);
 meta.diff=(meta.works!=null)?R2(meta.works-R2(sum)):null;
 meta.badChars=badCharStats(txt);
 meta.quality=importQuality(gs,meta);
 return{groups:gs,meta};
}
/* Ο έλεγχος του αθροίσματος πιάνει μόνο τα χρήματα. Δεν μπορεί να δει ότι
   χάθηκε ο κωδικός αναθεώρησης — που τροφοδοτεί ολόκληρο το βήμα 5 — ούτε ότι
   δεν βρέθηκε καθόλου άθροισμα ελέγχου στο αρχείο. Εδώ μετριέται η κάλυψη
   κάθε στήλης χωριστά, ώστε η επιτυχία να μη δηλώνεται όταν δεν αποδεικνύεται. */
/* Χαρακτήρες που δεν αποκωδικοποιήθηκαν. Παλιότερα χάνονταν αθόρυβα: το
   «ΔΗΜΟΣ ΡΟΔΟΥ» γινόταν «ΔΗΟ ΡΟΔΟΥ» χωρίς καμία ένδειξη. Τώρα σημαίνονται με
   \uFFFD και μετριούνται, ώστε ο χρήστης να ξέρει ότι πρέπει να ελέγξει. */
function badCharStats(txt){
 const t=String(txt||''); const n=(t.match(/\uFFFD/g)||[]).length;
 return {n, pct: t.length?Math.round(n/t.length*1000)/10 : 0};
}
function importQuality(gs,meta){
 const items=[]; gs.forEach(g=>g.items.forEach(it=>items.push(it)));
 const n=items.length||1;
 const pct=f=>Math.round(items.filter(f).length/n*100);
 const q={items:items.length, groups:gs.length,
  revPct:pct(it=>it.kodAnath), codePct:pct(it=>it.kodikos),
  unitPct:pct(it=>it.monada),  atPct:pct(it=>it.at),
  namedGroups:gs.filter(g=>!/^Ομάδα \d+$/.test(g.name)).length,
  checked:meta.works!=null, issues:[]};
 if(!items.length) q.issues.push({sev:'bad',t:'Δεν αναγνωρίστηκε κανένα άρθρο.'});
 if(!q.checked) q.issues.push({sev:'bad',
   t:'Δεν βρέθηκε γραμμή «Άθροισμα» στο αρχείο, άρα το αποτέλεσμα ΔΕΝ επαληθεύεται.',
   d:'Συγκρίνετε χειροκίνητα το άθροισμα '+F(meta.parsedWorks)+' € με τον έντυπο προϋπολογισμό πριν προχωρήσετε.'});
 else if(Math.abs(meta.diff)>0.02) q.issues.push({sev:'bad',
   t:'Λείπουν εργασίες αξίας '+F(Math.abs(meta.diff))+' €.',
   d:'Αναγνωρίστηκαν '+F(meta.parsedWorks)+' € έναντι αθροίσματος '+F(meta.works)+' € του αρχείου.'});
 if(items.length&&q.revPct<80) q.issues.push({sev:q.revPct<40?'bad':'warn',
   t:'Κωδικός αναθεώρησης βρέθηκε μόνο στο '+q.revPct+'% των άρθρων.',
   d:'Χωρίς αυτόν το βήμα 5 (Αναθεώρηση) δεν μπορεί να υπολογίσει σωστά. Συμπληρώστε τους στο βήμα 2.'});
 if(items.length&&q.codePct<80) q.issues.push({sev:'warn',
   t:'Κωδικός άρθρου βρέθηκε μόνο στο '+q.codePct+'% των άρθρων.'});
 if(items.length&&!q.namedGroups) q.issues.push({sev:'warn',
   t:'Δεν αναγνωρίστηκαν ονόματα ομάδων.',
   d:'Οι εκπτώσεις της οικονομικής προσφοράς αντιστοιχίζονται στις ομάδες — ελέγξτε τα ονόματα στο βήμα 2.'});
 if(meta.badChars&&meta.badChars.n>20) q.issues.push({sev:'warn',
   t:meta.badChars.n+' χαρακτήρες του PDF δεν αποκωδικοποιήθηκαν και εμφανίζονται ως «\uFFFD».',
   d:'Η γραμματοσειρά του αρχείου δηλώνει ελλιπή πίνακα χαρακτήρων. Τα ποσά και οι κωδικοί δεν επηρεάζονται, '
    +'αλλά ο τίτλος του έργου, τα ονόματα των ομάδων και οι περιγραφές χρειάζονται χειροκίνητο έλεγχο στο βήμα 2.'});
 q.ok=!q.issues.some(x=>x.sev==='bad');
 return q;
}
function qualityHTML(q){
 if(!q) return '';
 const line=(l,v,lim)=>`<br>· ${l}: <b style="color:${v>=lim?'inherit':'var(--warn)'}">${v}%</b>`;
 return `Αναγνωρίστηκαν <b>${q.groups}</b> ομάδες και <b>${q.items}</b> άρθρα.`
  +`<br><b>Κάλυψη στηλών:</b>`
  +line('Α.Τ.',q.atPct,90)+line('κωδ. άρθρου',q.codePct,80)
  +line('κωδ. αναθεώρησης',q.revPct,80)+line('μονάδα',q.unitPct,90)
  +(q.issues.length?'<br><br>'+q.issues.map(x=>
      `<b>${x.sev==='bad'?'⚠':'·'} ${E(x.t)}</b>${x.d?'<br>'+E(x.d):''}`).join('<br>'):'');
}
function doImport(replace){
 const txt=$('imp').value||'';
 if(!txt.trim()){$('impMsg').textContent='Επικολλήστε πρώτα το κείμενο.';return;}
 const {groups,meta}=parseBudget(txt);
 if(!groups.length){$('impMsg').textContent='Δεν αναγνωρίστηκε καμία γραμμή άρθρου. Ελέγξτε ότι αντιγράψατε ολόκληρο τον πίνακα.';return;}
 if(replace)S.groups=groups; else S.groups=S.groups.concat(groups);
 if(meta.quality&&!meta.quality.ok)
  flashMsg={k:'w',t:'Το κείμενο διαβάστηκε, αλλά χρειάζεται έλεγχος.',d:qualityHTML(meta.quality)};
 if(meta.ergo&&!S.project.ergo)S.project.ergo=meta.ergo.replace(/\s*ΠΡΟΫΠ[\s\S]*$/,'').trim();
 if(meta.dimos&&!S.project.dimos)S.project.dimos=meta.dimos;
 if(meta.geoe)S.project.geoe=meta.geoe;
 if(meta.apr)S.project.apr=meta.apr;
 if(meta.fpa)S.project.fpa=meta.fpa;
 if(meta.apol)S.project.apologistika=meta.apol;
 const n=groups.reduce((a,g)=>a+g.items.length,0);
 render();
 $('impMsg').textContent=`Αναγνωρίστηκαν ${groups.length} ομάδες και ${n} άρθρα.`;
}


/* ════════════════ ΦΟΡΤΩΣΗ ΠΡΟΫΠΟΛΟΓΙΣΜΟΥ ΑΠΟ ΑΡΧΕΙΟ ════════════════ */
let flashMsg=null;
/* Έχει ο χρήστης καταχωρίσει κάτι που θα χανόταν; */
function hasWork(){
 if(S.groups.length||(S.anath.periods||[]).length||(S.versions||[]).length)return true;
 const b=blank().project;
 return Object.keys(S.project).some(k=>{
  const v=S.project[k], d=b[k];
  return (v!==d)&&v!==''&&v!=null;
 });
}
async function loadBudgetFile(ev){
 const f=ev.target.files&&ev.target.files[0]; ev.target.value='';
 if(!f)return;
 /* Το confirm ζητείται όποτε υπάρχει οτιδήποτε προς απώλεια — όχι μόνο όταν
    υπάρχουν ήδη ομάδες. Στη φυσιολογική σειρά εργασίας (βήμα 1, μετά φόρτωση
    προϋπολογισμού) δεν υπάρχουν ακόμη ομάδες, οπότε παλιότερα δεν εμφανιζόταν
    τίποτα και η δουλειά του βήματος 1 χανόταν αθόρυβα. */
 if(hasWork()&&!confirm(
   'Θα αντικατασταθούν ο προϋπολογισμός, οι εκπτώσεις, οι ποσότητες του Α.Π.Ε.\n'
  +'και οι περίοδοι αναθεώρησης του τρέχοντος έργου.\n\n'
  +'Τα στοιχεία του βήματος 1 (τίτλος, πρόσωπα, αποφάσεις) διατηρούνται.\n\nΣυνέχεια;')){return;}
 if(/\.json$/i.test(f.name)){ const r=new FileReader();
   r.onload=()=>{try{applyProject(JSON.parse(r.result));}catch(e){alert('Το αρχείο δεν αναγνωρίστηκε.');}};
   r.readAsText(f); return; }
 flashMsg={k:'info',t:'Ανάγνωση «'+E(f.name)+'»…',d:'Τα πολυσέλιδα PDF χρειάζονται λίγα δευτερόλεπτα.'}; render();
 pdfProgress=(done,total,what)=>{
  const el=document.querySelector('.note b'); if(!el)return;
  el.textContent='Ανάγνωση «'+f.name+'» — '+what+(total>4?' ('+Math.round(done/total*100)+'%)':'');
 };
 try{
  let groups,meta;
  if(/\.xlsx$/i.test(f.name)){
   const rows=await xlsxToRows(await f.arrayBuffer());
   ({groups,meta}=parseRows(rows));
  }else{

   if(/\.pdf$/i.test(f.name)) txt=await pdfToText(await f.arrayBuffer());
   else if(/\.csv$/i.test(f.name)){ ({groups,meta}=parseRows(csvRows(await f.text()))); }
   else txt=await f.text();
   if(!groups){ const r=parseBudget(txt); groups=r.groups; meta=r.meta; }
  }
  if(groups.length){
   /* Μηδενίζονται μόνο όσα προέρχονται από τον προϋπολογισμό. Ο τίτλος, τα
      πρόσωπα, οι αποφάσεις και το μητρώο εγγράφων είναι δουλειά του χρήστη
      και δεν τα αγγίζει η φόρτωση αρχείου. */
   const keepProject=S.project, keepDocs=S.docs, keepChecks=S.checks;
   S=blank(); S.project=keepProject; S.docs=keepDocs; S.checks=keepChecks;
   if(curId){const e=LIB.find(x=>x.id===curId); if(e)e.data=S;} }
  if(!groups.length){
   flashMsg={k:'b',t:'Δεν αναγνωρίστηκε κανένα άρθρο στο «'+E(f.name)+'».',
     d:'Το αρχείο μπορεί να είναι σαρωμένη εικόνα ή να έχει ασυνήθιστη διάταξη. Δοκιμάστε την επικόλληση κειμένου παρακάτω.'};
   tab='p2'; render(); return;
  }
  pdfProgress=null;
  applyMeta(meta); S.groups=groups;
  const q=meta.quality;
  const parts=[];
  if(meta.ergo)parts.push('τίτλος έργου');
  if(meta.geoe)parts.push('Γ.Ε. & Ο.Ε. '+F(meta.geoe)+'%');
  if(meta.apr)parts.push('απρόβλεπτα '+F(meta.apr)+'%');
  if(meta.fpa)parts.push('Φ.Π.Α. '+F(meta.fpa)+'%');
  if(meta.apol!=null)parts.push('απολογιστικά '+F(meta.apol)+' €');
  if(meta.anath!=null)parts.push('πρόβλεψη αναθεώρησης '+F(meta.anath)+' €');
  if(meta.meletitis)parts.push('μελετητής');
  if(meta.proist)parts.push('προϊστάμενος');
  const detail=qualityHTML(q)
    +(q.checked?'<br><br>Το άθροισμα του αρχείου <b>'+F(meta.works)+' €</b> επαληθεύτηκε.':'')
    +(parts.length?'<br>Αντλήθηκαν επίσης: '+parts.join(' · ')+'.':'');
  flashMsg = q.ok
   ? {k:'g',t:'Ο προϋπολογισμός φορτώθηκε και επαληθεύτηκε.',d:detail}
   : {k:'w',t:'Ο προϋπολογισμός διαβάστηκε, αλλά χρειάζεται έλεγχος πριν προχωρήσετε.',d:detail};
  tab= q.ok?'p1':'p2'; render();
 }catch(e){
  pdfProgress=null;
  flashMsg={k:'b',t:'Δεν ήταν δυνατή η ανάγνωση του αρχείου.',d:e.message||''};
  tab='p2'; render();
 }
}
function applyMeta(m){
 const p=S.project;
 if(m.anathetousa)p.anathetousa=m.anathetousa;
 if(m.nomos)p.nomos=m.nomos;
 if(m.dimos)p.dimos=m.dimos;
 if(m.dnsi)p.dnsi=m.dnsi;
 if(m.ergo)p.ergo=m.ergo;
 if(m.geoe)p.geoe=m.geoe;
 if(m.apr)p.apr=m.apr;
 if(m.fpa)p.fpa=m.fpa;

/* ════════════════ ΑΝΑΓΝΩΣΗ ΟΙΚΟΝΟΜΙΚΗΣ ΠΡΟΣΦΟΡΑΣ ════════════════ */
/* Έντυπο Οικονομικής Προσφοράς Ε.Σ.Η.ΔΗ.Σ. (άρθρο 95 παρ. 2α).
   Οι εκπτώσεις αντιστοιχίζονται στις ομάδες με βάση τη δαπάνη τους κατά τον
   προϋπολογισμό μελέτης — μέθοδος ανεξάρτητη από τη γραφή των ονομάτων. */
const OROW=/^(.*?)([\d.]*\d,\d{2})\s+(\d+(?:[.,]\d+)?)\s*%\s+([\d.]*\d,\d{2})\s*$/;
const OPCT=/^(.*?)\s+([Α-ΩΆΈΉΊΌΎΏ][Α-ΩΆΈΉΊΌΎΏ\s]{3,})\s*%\s+(\d+(?:[.,]\d+)?)\s*$/;

function parseOffer(txt){
 const raw=txt.split(/\r?\n/);
 const L=raw.map(x=>x.replace(/\s+/g,' ').trim());
 const all=L.join('\n');
 const o={rows:[],pcts:[]};
 const num=v=>gr(v);

 let m;
 if((m=all.match(/Α\/Α\s*ΣΥΣΤΗΜΑΤΟΣ\s*:?\s*(\d+)/)))o.esidis=m[1];
 if((m=all.match(/Α\/Α\s*ΠΡΟΣΦΟΡΑΣ\s*:?\s*(\d+)/)))o.prosforaAA=m[1];
 if((m=all.match(/Ημ\/?νι?α\s*Δημιουργίας\s*:?\s*(\d{1,2}\/\d{1,2}\/\d{4})/)))o.imerominia=m[1].replace(/\//g,'-');
 if((m=all.match(/Α\.?\s?Φ\.?\s?Μ\.?\s*:?\s*(\d{9})/)))o.afm=m[1];
 if((m=all.match(/\(με ΦΠΑ\)\s*:?\s*([\d.]*\d,\d{2})/)))o.proypMeFpa=num(m[1]);

 // ΚΑ: το έντυπο τον τυπώνει σπασμένο σε τρία κομμάτια
 const pre=(all.match(/(\d{2})\s*-(?=\s|$)/)||[])[1];
 const bodies=[...all.matchAll(/(?:^|\s)(\d{4}\.\d{3,4})(?=\s|$)/g)].map(x=>x[1]).sort((a,b)=>b.length-a.length);
 let body=bodies[0];
 if(body&&(body.split('.')[1]||'').length===3){
  const t=(all.match(/^\s*(\d)\s*$/m)||[])[1]; if(t)body+=t;
 }
 if(pre&&body)o.ka=pre+'-'+body;

 // ανάδοχος: η γραμμή μετά το «Ο Προσφέρων»
 for(let i=0;i<L.length-1;i++){
  if(/^Ο\s+Προσφέρων$/.test(L[i])){
   const n=L[i+1];
   if(n&&n.length>4&&!/ΕΣΗΔΗΣ|Σελίδα|^\d/.test(n)){o.anadoxos=n;break;}
  }
 }
 // τίτλος έργου
 const ei=L.findIndex(x=>/^ΕΡΓΟ\s*:/.test(x));
 if(ei>=0){
  let t=L[ei].replace(/^ΕΡΓΟ\s*:\s*/,'');
  for(let k=ei+1;k<Math.min(ei+4,L.length);k++){
   if(/^(ΧΡΗΜΑΤΟΔΟΤΗΣΗ|ΠΡΟΫΠΟΛΟΓΙΣΜΟΣ|Α\/Α|ΕΝΤΥΠΟ)/.test(L[k])||!L[k])break;
   if(/^[\d.\-]+$/.test(L[k]))continue;
   t+=' '+L[k];
  }
  o.ergo=t.replace(/\s+/g,' ').replace(/\.$/,'').trim();
 }
 // χρηματοδότηση
 const xi=L.findIndex(x=>/^ΧΡΗΜΑΤΟΔΟΤΗΣΗ/.test(x));
 if(xi>=0){
  const inline=L[xi].replace(/^ΧΡΗΜΑΤΟΔΟΤΗΣΗ\s*:?\s*/,'').replace(/[\d.\-]+/g,'').trim();
  if(inline.length>3)o.xrimatodotisi=inline;
  else for(let k=xi+1;k<Math.min(xi+5,L.length);k++){
   if(/[Α-Ωα-ωΆ-Ώά-ώΐΰϊϋ]{4,}/.test(L[k])&&!/^\d|ΠΡΟΫΠΟΛΟΓΙΣΜΟΣ|ΔΗΜΟΠΡΑΤΗΣΗΣ|ΕΝΤΥΠΟ|ΕΣΗΔΗΣ/.test(L[k])){o.xrimatodotisi=L[k].trim();break;}
  }
 }

 // πίνακας «Προϋπολογισμός Προσφοράς»: δαπάνη μελέτης | έκπτωση % | δαπάνη μετά
 L.forEach((line,i)=>{
  const r=line.match(OROW); if(!r)return;
  let name=r[1].trim();
  for(let k=i-1;k>=Math.max(0,i-2);k--){
   if(L[k]&&/^[Α-ΩΆ-Ώ(][Α-ΩΆ-Ώ\s().\-\/]{3,}$/.test(L[k])&&!OROW.test(L[k])){name=(L[k]+' '+name).trim();break;}
  }
  const nx=L[i+1];
  if(nx&&/^[Α-ΩΆ-Ώ(][Α-ΩΆ-Ώ\s().\-\/]{3,}$/.test(nx)&&!OROW.test(nx))name=(name+' '+nx).trim();
  o.rows.push({name:name.replace(/\s+/g,' ').trim(),budget:num(r[2]),discount:num(r[3]),after:num(r[4])});
 });
 // εφεδρικά: πίνακας «Προσφορά ποσοστών έκπτωσης»
 L.forEach(line=>{
  const r=line.match(OPCT); if(!r)return;
  if(/ΓΕ|ΟΕ|ΑΠΡΟΒΛΕΠΤΑ|ΑΝΑΘΕΩΡΗΣΗ|ΑΠΟΛΟΓΙΣΤΙΚΑ|ΦΠΑ/.test(line))return;
  o.pcts.push({name:(r[1]||'').trim(),discount:num(r[3])});
 });

 // συγκεντρωτικά για διασταύρωση
 if((m=all.match(/Σ1\s*:?\s*([\d.]*\d,\d{2})\s*Π1\s*:?\s*([\d.]*\d,\d{2})/))){o.S1=num(m[1]);o.P1=num(m[2]);}
 if((m=all.match(/Σ2\s*:?\s*([\d.]*\d,\d{2})\s*Π2\s*:?\s*([\d.]*\d,\d{2})/))){o.S2=num(m[1]);o.P2=num(m[2]);}
 if((m=all.match(/Μέση\s*Έκπτωση[\s\S]{0,80}?(\d+,\d+)\s*%/)))o.mean=num(m[1]);
 if((m=all.match(/ΓΕ\s*&\s*ΟΕ[^\d\n]*(\d+(?:[.,]\d+)?)\s*%/)))o.geoe=num(m[1]);
 if((m=all.match(/ΑΠΡΟΒΛΕΠΤΑ\s*(\d+(?:[.,]\d+)?)\s*%\s*([\d.]*\d,\d{2})\s+([\d.]*\d,\d{2})/))){o.apr=num(m[1]);o.aprOffer=num(m[3]);}
 if((m=all.match(/ΑΠΟΛΟΓΙΣΤΙΚΑ[^\n\d]*([\d.]*\d,\d{2})\s+([\d.]*\d,\d{2})/))){o.apol=num(m[2]);}
 if((m=all.match(/ΑΝΑΘΕΩΡΗΣΗ\s+([\d.]*\d,\d{2})\s+([\d.]*\d,\d{2})/))){o.anathMel=num(m[1]);o.anath=num(m[2]);}
 const ends=[...all.matchAll(/Κατά την προσφορά\s*:?\s*([\d.]*\d,\d{2})/g)].map(x=>num(x[1]));
 if(ends.length)o.totalOffer=ends[ends.length-1];
 o.isOffer=/ΟΙΚΟΝΟΜΙΚΗΣ ΠΡΟΣΦΟΡΑΣ|ΠΟΣΟΣΤΩΝ ΕΚΠΤΩΣΗΣ/.test(all)||o.rows.length>0;
 return o;
}

/* αντιστοίχιση εκπτώσεων στις ομάδες του έργου */
function normName(s){
 return String(s||'').toUpperCase()
  .replace(/[ΆΑ]/g,'Α').replace(/[ΈΕ]/g,'Ε').replace(/[ΉΗ]/g,'Η').replace(/[ΊΪΐΙ]/g,'Ι')
  .replace(/[ΌΟ]/g,'Ο').replace(/[ΎΫΰΥ]/g,'Υ').replace(/[ΏΩ]/g,'Ω')
  .replace(/[^Α-Ω0-9]/g,'');
}
function applyOffer(o){
 const c=calc();
 const used=new Set(); const report=[];
 // 1ο κριτήριο: ταύτιση δαπάνης ομάδας κατά τον προϋπολογισμό
 o.rows.forEach(r=>{
  let gi=S.groups.findIndex((g,i)=>!used.has(i)&&Math.abs(c.G[i].budRaw-r.budget)<0.02);
  if(gi<0){
   const rn=normName(r.name);
   gi=S.groups.findIndex((g,i)=>{const gn=normName(g.name);
     return !used.has(i)&&rn.length>5&&gn.length>5&&(gn.indexOf(rn)>=0||rn.indexOf(gn)>=0);});
  }
  if(gi>=0){used.add(gi);S.groups[gi].discount=r.discount;
   report.push({ok:true,g:S.groups[gi].name,d:r.discount,b:r.budget});}
  else report.push({ok:false,g:r.name||('δαπάνη '+F(r.budget)+' €'),d:r.discount,b:r.budget});
 });
 // εφεδρικά: κατά σειρά, αν δεν βρέθηκε τίποτα
 if(!report.some(x=>x.ok)&&o.pcts.length&&o.pcts.length<=S.groups.length){
  o.pcts.forEach((p,i)=>{ if(S.groups[i]){S.groups[i].discount=p.discount;
    report.push({ok:true,g:S.groups[i].name,d:p.discount,b:null});} });
 }
 const p=S.project;
 if(o.anadoxos)p.anadoxos=o.anadoxos;
 if(o.esidis)p.esidis=o.esidis;
 if(o.prosforaAA)p.prosforaAA=o.prosforaAA;
 if(o.imerominia&&!p.imDiagonismou)p.imDiagonismou=o.imerominia;
 if(o.ergo&&!p.ergo)p.ergo=o.ergo;
 if(o.xrimatodotisi&&!p.xrimatodotisi)p.xrimatodotisi=o.xrimatodotisi;
 if(o.ka&&!p.ka)p.ka=o.ka;
 if(o.geoe)p.geoe=o.geoe;
 if(o.apr)p.apr=o.apr;
 if(o.apol!=null)p.apologistika=o.apol;
 if(o.anath!=null)p.anathProv=o.anath;
 if(o.afm)p.afm=o.afm;
 return report;
}


async function loadOfferFile(ev){
 const f=ev.target.files&&ev.target.files[0]; ev.target.value='';
 if(!f)return;
 if(!S.groups.length){
  flashMsg={k:'w',t:'Φορτώστε πρώτα τον προϋπολογισμό.',
   d:'Οι εκπτώσεις της προσφοράς αντιστοιχίζονται στις ομάδες εργασιών του προϋπολογισμού.'};
  tab='p2'; render(); return;
 }
 flashMsg={k:'info',t:'Ανάγνωση προσφοράς «'+E(f.name)+'»…',d:''}; render();
 try{
  let txt;
  if(/\.pdf$/i.test(f.name)) txt=await pdfToText(await f.arrayBuffer());
  else txt=await f.text();
  const o=parseOffer(txt);
  if(!o.isOffer||(!o.rows.length&&!o.pcts.length)){
   flashMsg={k:'b',t:'Δεν αναγνωρίστηκε έντυπο οικονομικής προσφοράς.',
    d:'Το αρχείο δεν περιέχει πίνακα ποσοστών έκπτωσης ανά ομάδα. Μπορείτε να συμπληρώσετε τις εκπτώσεις χειροκίνητα στο βήμα 3.'};
   tab='p3'; render(); return;
  }
  const rep=applyOffer(o);
  const okN=rep.filter(r=>r.ok).length, badN=rep.filter(r=>!r.ok).length;
  const c=calc();
  const chk=[];
  if(o.S1!=null) chk.push('άθροισμα μελέτης '+F(o.S1)+' €'+(Math.abs(o.S1-c.budW)<0.02?' ✓':' ✗ (η εφαρμογή υπολογίζει '+F(c.budW)+' €)'));
  if(o.P1!=null) chk.push('μετά έκπτωση '+F(o.P1)+' €'+(Math.abs(o.P1-c.conWorks)<0.02?' ✓':' ✗ ('+F(c.conWorks)+' €)'));
  if(o.mean!=null){const mean=c.budW?R2((1-c.conWorks/c.budW)*100):0;
   chk.push('μέση έκπτωση '+P(o.mean)+(Math.abs(o.mean-mean)<0.02?' ✓':' ✗ ('+P(mean)+')'));}
  const lines=rep.map(r=>(r.ok?'· ':'· ✗ ')+E(r.g)+' → '+F(r.d)+'%').join('<br>');
  const bad=chk.some(x=>x.indexOf('✗')>=0)||badN>0;
  flashMsg={k:bad?'w':'g',
   t:bad?('Η προσφορά διαβάστηκε, αλλά χρειάζεται έλεγχος.'):('Η οικονομική προσφορά εφαρμόστηκε σε '+okN+' ομάδες.'),
   d:(o.anadoxos?'<b>Ανάδοχος:</b> '+E(o.anadoxos)+(o.prosforaAA?' — Α/Α προσφοράς '+E(o.prosforaAA):'')+'<br>':'')+
     lines+(chk.length?'<br><b>Διασταύρωση:</b> '+chk.join(' · '):'')+
     (badN?'<br>Οι ομάδες με ✗ δεν αντιστοιχίστηκαν — ορίστε την έκπτωσή τους χειροκίνητα.':'')};
  tab='p3'; render();
 }catch(e){
  flashMsg={k:'b',t:'Δεν ήταν δυνατή η ανάγνωση του αρχείου.',d:e.message||''};
  render();
 }
}


/* ════════════════ ΑΝΑΓΝΩΣΗ ΑΠΟ ΦΥΛΛΟ ════════════════ */
function csvRows(txt){
 const sep=(txt.match(/;/g)||[]).length>(txt.match(/,/g)||[]).length?';':',';
 return txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
  const out=[];let cur='',q=false;
  for(let i=0;i<l.length;i++){const c=l[i];
   if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
   else if(c===sep&&!q){out.push(cur);cur='';}
   else cur+=c;}
  out.push(cur); return out.map(x=>x.trim());
 });
}
/* Αναγνωρίζει τη γραμμή κεφαλίδας και αντιστοιχίζει στήλες με βάση
   τους τίτλους τους, ώστε να δέχεται και φύλλα με άλλη σειρά στηλών. */
const HDR={at:/^(α\.?τ\.?|a\.?t\.?|αυξ)/i, kod:/κωδ.*(άρθρ|αρθρ)|^κωδικός$/i,
 per:/είδος|περιγραφ|εργασ/i, anath:/αναθεώρ|αναθεωρ/i, mon:/^μον|μονάδ/i,
 pos:/ποσότ|ποσοτ/i, tim:/τιμή|τιμη|μονάδας/i, dap:/δαπάν|δαπαν/i, om:/^ομάδ/i};
function parseRows(rows){
 const meta={}, groups=[]; let cur=null, map=null;
 const norm=r=>r.map(x=>String(x==null?'':x).trim());
 const findMap=r=>{
  const m={}; let hits=0;
  r.forEach((c,i)=>{ for(const k in HDR){ if(m[k]===undefined&&HDR[k].test(c)){m[k]=i;hits++;break;} } });
  return (m.pos!==undefined&&m.tim!==undefined&&hits>=3)?m:null;
 };
 rows.forEach(raw=>{
  const r=norm(raw); const joined=r.join(' ').trim();
  if(!joined) return;
  if(!map){ const m=findMap(r); if(m){map=m;return;} }
  let mm;
  if((mm=joined.match(/ΓΕ\s*&?\s*ΟΕ\s*([\d,.]+)\s*%/i))) meta.geoe=gr(mm[1]);
  if((mm=joined.match(/Απρόβλεπτα\s*([\d,.]+)\s*%/i))) meta.apr=gr(mm[1]);
  if((mm=joined.match(/Φ\.?Π\.?Α\.?\s*([\d,.]+)\s*%/i))) meta.fpa=gr(mm[1]);
  if(/^ΕΡΓΟ\s*:/i.test(joined)) meta.ergo=joined.replace(/^ΕΡΓΟ\s*:\s*/i,'').trim();
  if(!map) return;
  const at=(r[map.at]||'').trim();
  const pos=gr(r[map.pos]), tim=gr(r[map.tim]);
  const per=(r[map.per!==undefined?map.per:1]||'').trim();
  const isGroup=(map.om!==undefined&&r[map.om])||(/^\d{1,2}\.\s*\S/.test(joined)&&!pos&&!tim);
  if(isGroup||(per&&!pos&&!tim&&!/σύνολο|άθροισμα/i.test(per))){
   /* Ο τίτλος της ομάδας μπορεί να βρίσκεται σε οποιοδήποτε κελί της γραμμής,
      όχι απαραίτητα στη στήλη της περιγραφής. */
   let name=(map.om!==undefined&&r[map.om])||per;
   if(!name) name=r.find(x=>x&&!/^[\d.,\s]*$/.test(x))||'';
   name=name.replace(/^\d{1,2}[.)]\s*/,'').trim();
   if(name&&name.length>2&&!/σύνολο|άθροισμα|μεταφορ/i.test(name)){
    cur={id:uid(),name,discount:0,items:[]}; groups.push(cur);
   }
   return;
  }
  if(!pos&&!tim) return;
  if(/σύνολο|άθροισμα|μεταφορ/i.test(per)) return;
  if(!cur){cur={id:uid(),name:'Ομάδα 1',discount:0,items:[]};groups.push(cur);}
  const it={id:uid(),at,kodikos:(r[map.kod]||'').trim(),perigrafi:per||'(χωρίς περιγραφή)',
   kodAnath:(r[map.anath]||'').trim(),monada:(r[map.mon]||'').trim(),posotita:pos,timi:tim};
  it.posotitaApe=pos; it.posotitaPrev=pos;
  cur.items.push(it);
 });
 const gs=groups.filter(g=>g.items.length);
 let sum=0; gs.forEach(g=>g.items.forEach(it=>{sum+=R2(it.posotita*it.timi);}));
 meta.parsedWorks=R2(sum); meta.works=meta.works??null; meta.diff=null;
 return{groups:gs,meta};
}

function loadJSON(ev){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
   const d=JSON.parse(r.result);
   if(d&&d.apeLibrary&&Array.isArray(d.items)){
    d.items.forEach(x=>LIB.push({id:uid(),name:x.name||'Έργο',updated:x.updated||nowStr(),data:normalize(x.data)}));
    libOpen(LIB.at(-1).id); libSave();
    flashMsg={k:'g',t:'Προστέθηκαν '+d.items.length+' έργα στη βιβλιοθήκη.',d:''};
    render();
   } else applyProject(d);
 }catch(e){alert('Το αρχείο δεν αναγνωρίστηκε ως έργο της εφαρμογής.');}};
 r.readAsText(f);ev.target.value='';
}

<script>
/* ══════════════════════════════════════════════════════════════
   ΑΝΑΓΝΩΣΗ ΔΙΟΙΚΗΤΙΚΩΝ ΕΓΓΡΑΦΩΝ
   Σαρώνει οποιοδήποτε έγγραφο (απόφαση ΔΙΑΥΓΕΙΑΣ, σύμβαση ΚΗΜΔΗΣ,
   πρακτικό, βεβαίωση) και εντοπίζει ΑΔΑ, ΑΔΑΜ, αριθμούς πρωτοκόλλου
   και απόφασης, ημερομηνίες και λοιπά αναγνωριστικά.
   ══════════════════════════════════════════════════════════════ */
const MONTHS={'ΙΑΝΟΥΑΡΙΟΥ':1,'ΦΕΒΡΟΥΑΡΙΟΥ':2,'ΜΑΡΤΙΟΥ':3,'ΑΠΡΙΛΙΟΥ':4,'ΜΑΙΟΥ':5,'ΜΑΪΟΥ':5,
 'ΙΟΥΝΙΟΥ':6,'ΙΟΥΛΙΟΥ':7,'ΑΥΓΟΥΣΤΟΥ':8,'ΣΕΠΤΕΜΒΡΙΟΥ':9,'ΟΚΤΩΒΡΙΟΥ':10,'ΝΟΕΜΒΡΙΟΥ':11,'ΔΕΚΕΜΒΡΙΟΥ':12};
const pad2=v=>String(v).padStart(2,'0');

function docScan(txt){
 const RAW=String(txt||'');
 const N=RAW.replace(/\s+/g,' ');
 /* Το toUpperCase() διατηρεί τους τόνους (ό → Ό), οπότε αφαιρούνται ρητά.
    Οι αντικαταστάσεις είναι ισομήκεις ώστε να μένουν έγκυροι οι δείκτες θέσης. */
 const U=N.replace(/ΐ/g,'ι').replace(/ΰ/g,'υ').toUpperCase()
          .replace(/[ΆΈΉΊΌΎΏΪΫ]/g,c=>({'Ά':'Α','Έ':'Ε','Ή':'Η','Ί':'Ι','Ό':'Ο','Ύ':'Υ','Ώ':'Ω','Ϊ':'Ι','Ϋ':'Υ'}[c]));
 const F=[];
 const push=(type,label,value,extra)=>{
  if(value==null)return; value=String(value).trim(); if(!value)return;
  if(F.some(f=>f.type===type&&f.value===value))return;
  F.push({type,label,value,extra:extra||''});
 };
 /* Τα μοτίβα γράφονται με κεφαλαία και εκτελούνται στο κεφαλαιοποιημένο κείμενο,
    ώστε να πιάνουν κάθε γραφή («Αρ. Πρωτ.», «ΑΡ. ΠΡΩΤ.», «αρ. πρωτ.»). */
 const each=(re,fn)=>{ let m,i=0; const r=new RegExp(re.source,re.flags.replace('g','')+'g');
  while((m=r.exec(U))&&i++<400) fn(m); };

 /* ΑΔΑ — ΔΙΑΥΓΕΙΑ */
 each(/ΑΔΑ\s*:?\s*([0-9A-ZΑ-ΩΆΈΉΊΌΎΏ]{4,12}\s*-\s*[0-9A-ZΑ-ΩΆΈΉΊΌΎΏ]{2,5})/g,
   m=>push('ada','ΑΔΑ',m[1].replace(/\s+/g,'')));
 /* ΑΔΑΜ — ΚΗΜΔΗΣ */
 each(/(\d{2}(?:SYMV|PROC|AWRD|REQ|INF|CON|DIAG|ADAM)\d{6,14})/gi,
   m=>push('adam','ΑΔΑΜ',m[1].toUpperCase()));
 each(/ΑΔΑΜ\s*:?\s*([0-9A-Z]{10,20})/gi, m=>push('adam','ΑΔΑΜ',m[1].toUpperCase()));

 /* αριθμός πρωτοκόλλου, με ή χωρίς ημερομηνία */
 each(/(?:ΑΡ|ΑΡΙΘ|ΑΡΙΘΜ)[.\s]*(?:ΠΡΩΤ|ΠΡ)[.\s:]*(\d{1,7})\s*\/\s*(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4})/g,
   m=>push('prot','Αρ. πρωτοκόλλου',m[1],normDate(m[2])));
 each(/(?:ΑΡ|ΑΡΙΘ|ΑΡΙΘΜ)[.\s]*(?:ΠΡΩΤ|ΠΡ)[.\s:]*(\d{1,7}(?:\/\d{1,4})?)(?![\d\-\/.])/g,
   m=>push('prot','Αρ. πρωτοκόλλου',m[1]));

 /* αριθμός απόφασης */
 each(/(?:ΑΡΙΘΜΟΣ|ΑΡΙΘΜ|ΑΡΙΘ|ΑΡ)[.\s]*(?:ΑΠΟΦΑΣΗΣ|ΑΠΟΦΑΣΗ|ΑΠΟΦ)[.\s:]*(\d{1,6}(?:\s*\/\s*\d{2,4})?)/g,
   m=>push('apof','Αριθμός απόφασης',m[1].replace(/\s/g,'')));
 each(/ΥΠ[’'΄]?\s*ΑΡΙΘ[Μ.]*\s*(\d{1,6})\s+ΑΡ[.\s]*ΠΡ/g, m=>push('apof','Αριθμός απόφασης',m[1]));
 each(/ΑΠΟΦΑΣΗ\s*(?:ΥΠ[’'΄]?\s*)?ΑΡΙΘ[Μ.]*\s*(\d{1,6}(?:\/\d{2,4})?)/g,
   m=>push('apof','Αριθμός απόφασης',m[1]));

 /* συνεδρίαση / πρακτικό / θέμα */
 each(/(\d{1,3})[ΗΉ]?\s*(?:\S+\s+){0,3}ΣΥΝΕΔΡΙΑΣ/g, m=>push('synedr','Συνεδρίαση',m[1]));
 each(/ΠΡΑΚΤΙΚ\S*\s*(?:ΑΡΙΘ[Μ.]*\s*)?(\d{1,3})/g, m=>push('synedr','Πρακτικό',m[1]));
 /* θέμα: διαβάζεται κατά γραμμές, ώστε να μην παρασύρει το υπόλοιπο κείμενο */
 RAW.split(/\n/).forEach((line,i,arr)=>{
  const m=line.match(/ΘΕΜΑ\s*:?\s*(.{8,})$/i);
  if(!m)return;
  let t=m[1].trim();
  for(let k=i+1;k<Math.min(i+3,arr.length);k++){
   const nx=(arr[k]||'').trim();
   if(!nx||/^(ΑΠΟΦΑΣΗ|ΕΧΟΝΤΑΣ|Α\s*Π\s*Ο)/i.test(nx))break;
   if(t.length>170)break;
   t+=' '+nx;
  }
  push('thema','Θέμα',t.replace(/\s+/g,' ').slice(0,180));
 });

 /* ημερομηνία ψηφιακής υπογραφής ή ανάρτησης */
 each(/DATE\s*:?\s*(\d{4})\.(\d{2})\.(\d{2})/g, m=>push('date','Ημερομηνία ανάρτησης',m[3]+'-'+m[2]+'-'+m[1]));
 each(/ΗΜΕΡΟΜΗΝΙΑ\s*(?:ΚΑΤΑΧΩΡ\S*|ΑΝΑΡΤΗΣΗΣ)\s*:?\s*(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4})/g,
   m=>push('date','Ημερομηνία καταχώρησης',normDate(m[1])));
 /* γενικές ημερομηνίες */
 each(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/g, m=>{
  const d=+m[1],mo=+m[2]; if(mo<1||mo>12||d<1||d>31)return;
  push('date','Ημερομηνία',pad2(d)+'-'+pad2(mo)+'-'+m[3]);
 });
 each(/(\d{1,2})\s+([Α-ΩΆΈΉΊΌΎΏΪ]{4,12})\s+(\d{4})/g, m=>{
  const mo=MONTHS[m[2]]; if(!mo)return;
  push('date','Ημερομηνία',pad2(m[1])+'-'+pad2(mo)+'-'+m[3]);
 });

 /* λοιπά αναγνωριστικά */
 each(/(?:Α\/Α\s*ΣΥΣΤΗΜΑΤΟΣ|ΣΥΣΤΗΜΙΚΟΣ\s*ΑΡΙΘΜΟΣ|ΕΣΗΔΗΣ)\s*:?\s*(\d{5,8})/g,
   m=>push('esidis','Α/Α ΕΣΗΔΗΣ',m[1]));
 each(/Α\/Α\s*ΠΡΟΣΦΟΡΑΣ\s*:?\s*(\d{4,8})/g, m=>push('prosfora','Α/Α προσφοράς',m[1]));
 each(/Α\.?\s?Φ\.?\s?Μ\.?\s*:?\s*(\d{9})/g, m=>push('afm','Α.Φ.Μ.',m[1]));
 each(/(?:Κ\.?Α\.?|ΚΩΔΙΚΟΣ)\s*:?\s*(\d{2}\s*-\s*\d{4}\.\d{3,4})/g,
   m=>push('ka','Κ.Α. προϋπολογισμού',m[1].replace(/\s/g,'')));
 each(/(?:ΠΟΣΟΥ|ΠΟΣΟ|ΔΑΠΑΝΗΣ|ΣΥΝΟΛΙΚΟΥ ΠΟΣΟΥ)\s*:?\s*([\d.]*\d,\d{2})\s*(?:€|ΕΥΡΩ)/g,
   m=>push('amount','Ποσό',m[1]+' €'));
 each(/(?:ΠΡΟΘΕΣΜΙΑ|ΠΕΡΑΙΩΣΗΣ)[^.]{0,40}?(\d{1,3})\s*\(?\d{0,3}\)?\s*(ΜΗΝΕΣ|ΜΗΝΩΝ|ΗΜΕΡΕΣ|ΗΜΕΡΩΝ|ΗΜΕΡΟΛΟΓΙΑΚΕΣ)/g,
   m=>push('prothesmia','Προθεσμία',m[1]+' '+({ΜΗΝΕΣ:'μήνες',ΜΗΝΩΝ:'μηνών',ΗΜΕΡΕΣ:'ημέρες',
     ΗΜΕΡΩΝ:'ημερών',ΗΜΕΡΟΛΟΓΙΑΚΕΣ:'ημερολογιακές ημέρες'}[m[2]]||m[2].toLowerCase())));

 /* ταξινόμηση: τα πιο ειδικά πρώτα */
 const ord={ada:1,adam:2,apof:3,prot:4,synedr:5,date:6,esidis:7,prosfora:8,afm:9,ka:10,prothesmia:11,amount:12,thema:13};
 F.sort((a,b)=>(ord[a.type]||99)-(ord[b.type]||99));
 return F;
}
function normDate(s){
 const m=String(s).match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
 if(!m)return String(s);
 let y=m[3]; if(y.length===2)y='20'+y;
 return pad2(m[1])+'-'+pad2(m[2])+'-'+y;
}
