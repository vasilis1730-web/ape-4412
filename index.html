function regDoc(name,field,F,kind,auth){
 const g=t=>(F.find(x=>x.type===t)||{}).value||'';
 S.docs=S.docs||[];
 S.docs.push({name,field:(DOCFIELDS.find(x=>x.p===field)||{}).l||field||'—',
  kind:kind||'', auth:auth||'', ada:g('ada'), adam:g('adam'),
  prot:g('prot'), apof:g('apof'), date:g('date'), thema:g('thema'), at:nowStr()});

}
function delDoc(i){ S.docs.splice(i,1); libSave(); render(); }

/* ── πεδία που δέχονται τιμές από έγγραφα ── */
const DOCFIELDS=[
 {p:'project.apofMeletis',    l:'Απόφαση έγκρισης μελέτης & όρων'},

 {p:'project.prothesmia',     l:'Αρχική προθεσμία περαίωσης'},
 {p:'project.paratasis',      l:'Αποφάσεις παράτασης'},
 {p:'project.apofTS',         l:'Γνωμοδότηση Τεχνικού Συμβουλίου'},
 {p:'project.analipsi',       l:'Απόφαση ανάληψης υποχρέωσης'},
 {p:'project.esy',            l:'Άρθρο Ε.Σ.Υ. για «επί έλασσον»'},

/* τι τύπο ευρήματος περιμένει κάθε πεδίο */
const WANT={
 'project.apofMeletis':'decision','project.apofKatakyrwsis':'decision',
 'project.apofTS':'decision','project.analipsi':'decision','project.paratasis':'decision',
 'project.arPrwtSymvasis':'prot','project.adam':'adam',

 'project.prothesmia':'prothesmia','project.arKataxwrisis':'prot',

let docTarget=null, docFindings=null, docName='';

function docBtn(path){
 return `<button class="clip" title="Εισαγωγή στοιχείων από έγγραφο"
   onclick="docTarget='${path}';document.getElementById('docf').click()">📎</button>`;
}
async function loadDocFile(ev){
 const f=ev.target.files&&ev.target.files[0]; ev.target.value='';
 if(!f)return;
 docName=f.name;
 try{
  let txt;
  if(/\.pdf$/i.test(f.name)) txt=await pdfToText(await f.arrayBuffer());
  else txt=await f.text();

   render(); return;

 }catch(e){

  render();
 }
}
const firstOf=(F,t)=>{const x=F.find(f=>f.type===t);return x?x:null;};
function composeDecision(F){
 const a=firstOf(F,'apof'), pr=firstOf(F,'prot'), ada=firstOf(F,'ada'), d=firstOf(F,'date');
 let s='';
 if(a) s=a.value;
 else if(pr) s='αρ. πρωτ. '+pr.value;
 if(pr&&a) s+=' (αρ. πρωτ. '+pr.value+(pr.extra?'/'+pr.extra:'')+')';
 else if(pr&&pr.extra) s+='/'+pr.extra;
 if(!s&&d) s=d.value;
 if(ada) s+=(s?' – ':'')+'ΑΔΑ: '+ada.value;
 return s;
}
function valueFor(path,F){
 const want=WANT[path];
 if(want==='decision') return composeDecision(F);
 const x=firstOf(F,want);
 if(x) return x.value+(want==='prot'&&x.extra?'/'+x.extra:'');
 return composeDecision(F);
}
function autoApply(F,path){
 const done=[];
 if(path){ const v=valueFor(path,F);
  if(v){ setPath(path,v); done.push({p:path,v}); } }
 // συμπληρώνονται και άλλα κενά πεδία, όταν το εύρημα είναι μονοσήμαντο
 const uniq=t=>{const a=F.filter(f=>f.type===t);return a.length===1?a[0].value:null;};
 [['project.adam','adam'],['project.esidis','esidis'],['project.prosforaAA','prosfora'],
  ['project.afm','afm'],['project.ka','ka']].forEach(([p,t])=>{
  if(p===path)return; const v=uniq(t);
  if(v&&!getPath(p)){ setPath(p,v); done.push({p,v}); }
 });
 return done;
}
function getPath(p){return p.split('.').reduce((o,k)=>o?o[k]:'',S);}
function setPath(p,v){const ks=p.split('.'),last=ks.pop();let o=S;ks.forEach(k=>o=o[k]);
 if(last==='paratasis'&&o[last]) o[last]=o[last].replace(/\s*$/,'')+'\n'+v; else o[last]=v;}

function openDocPanel(applied){
 const F=docFindings||[];
 const lbl=p=>(DOCFIELDS.find(x=>x.p===p)||{}).l||p;
 const rows=F.map((f,i)=>`<tr>
   <td><span class="tag">${E(f.label)}</span></td>
   <td style="font-family:var(--num);font-weight:600">${E(f.value)}${f.extra?' <span class="hint">/ '+E(f.extra)+'</span>':''}</td>
   <td><select id="dsel${i}" style="padding:4px 6px;font-size:12px">
     ${DOCFIELDS.map(x=>`<option value="${x.p}"${x.p===docTarget?' selected':''}>${E(x.l)}</option>`).join('')}
   </select></td>
   <td><button class="btn gh sm" onclick="insertFinding(${i})">Εισαγωγή</button></td></tr>`).join('');
 const ap=applied.length
   ? `<div class="note g" style="margin:0 0 12px"><b>Συμπληρώθηκαν αυτόματα:</b><br>${
       applied.map(a=>'· '+E(lbl(a.p))+' → <b>'+E(a.v)+'</b>').join('<br>')}</div>`
   : `<div class="note w" style="margin:0 0 12px">Δεν συμπληρώθηκε αυτόματα κανένα πεδίο. Επιλέξτε παρακάτω πού θα μπει κάθε τιμή.</div>`;
 $('modal').innerHTML=`<div class="mbox">
   <h3>Στοιχεία από «${E(docName)}»<button class="btn gh sm" style="margin-left:auto" onclick="closeDocPanel()">Κλείσιμο</button></h3>
   <div class="mbody">${ap}
    <p class="hint" style="margin:0 0 10px">Κάθε τιμή που εντοπίστηκε μπορεί να τοποθετηθεί σε όποιο πεδίο θέλετε.</p>
    <table class="t"><thead><tr><th style="width:150px">Είδος</th><th>Τιμή</th>
      <th style="width:250px">Πεδίο</th><th style="width:96px"></th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
 $('modal').style.display='flex';
}
function insertFinding(i){
 const f=docFindings[i], p=$('dsel'+i).value;
 setPath(p,f.value+(f.type==='prot'&&f.extra?'/'+f.extra:''));
 render(); openDocPanel([{p,v:f.value}]);
}
function closeDocPanel(){$('modal').style.display='none';$('modal').innerHTML='';docTarget=null;}
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   ΜΑΖΙΚΗ ΕΙΣΑΓΩΓΗ ΕΓΓΡΑΦΩΝ ΕΡΓΟΥ
   Δέχεται όλα τα έγγραφα του φακέλου μαζί, αναγνωρίζει το είδος
   καθενός και συγκεντρώνει τα στοιχεία τους. Όπου δύο έγγραφα
   δίνουν διαφορετική τιμή, υπερισχύει το πιο έγκυρο: έγγραφο με
   ΑΔΑ, ΑΔΑΜ ή ψηφιακή υπογραφή θεωρείται βέβαιο.
   ══════════════════════════════════════════════════════════════ */
const AUTH={3:'Επιβεβαιωμένο',2:'Αναγνωρισμένο',1:'Ενδεικτικό'};
const KINDS={
 budget:'Προϋπολογισμός μελέτης', offer:'Οικονομική προσφορά',
 terms:'Έγκριση μελέτης & όρων', award:'Κατακύρωση / ανάθεση',
 contract:'Σύμβαση – συμφωνητικό', extension:'Παράταση προθεσμίας',
 techcouncil:'Γνωμοδότηση Τεχνικού Συμβουλίου', commitment:'Ανάληψη υποχρέωσης',
 esy:'Ειδική Συγγραφή Υποχρεώσεων', apeApproval:'Έγκριση Α.Π.Ε.',
 decision:'Απόφαση αναθέτουσας αρχής', unknown:'Μη αναγνωρισμένο'
};
function classifyDoc(txt){
 const U=txt.replace(/\s+/g,' ').toUpperCase()
   .replace(/[ΆΈΉΊΌΎΏΪΫ]/g,c=>({'Ά':'Α','Έ':'Ε','Ή':'Η','Ί':'Ι','Ό':'Ο','Ύ':'Υ','Ώ':'Ω','Ϊ':'Ι','Ϋ':'Υ'}[c]));
 const has=re=>re.test(U);
 const signed=has(/INFORMATICS DEVELOPMENT AGENCY|DIGITALLY SIGNED|ΨΗΦΙΑΚΑ ΥΠΟΓΕΓΡΑΜΜΕΝ/)
   ||has(/ΑΔΑ\s*:/)||has(/ΑΔΑΜ\s*:/)||has(/\d{2}(SYMV|PROC|AWRD|REQ)\d{6}/);
 let kind='unknown';
 if(has(/ΕΝΤΥΠΟ ΟΙΚΟΝΟΜΙΚΗΣ ΠΡΟΣΦΟΡΑΣ|ΠΡΟΣΦΟΡΑ ΠΟΣΟΣΤΩΝ ΕΚΠΤΩΣΗΣ/)) kind='offer';
 else if(has(/ΠΡΟ[ΥΫ]ΠΟΛΟΓΙΣΜΟΣ (ΜΕΛΕΤΗΣ|ΔΗΜΟΠΡΑΤΗΣΗΣ|ΕΡΓΟΥ)/)&&has(/ΕΙΔΟΣ ΕΡΓΑΣΙΩΝ|ΤΙΜΗ ΜΟΝΑΔΑΣ|ΚΩΔΙΚΟΣ ΑΝΑΘΕΩΡΗΣΗΣ|ΜΕΡΙΚΗ ΔΑΠΑΝΗ|ΟΛΙΚΗ ΔΑΠΑΝΗ/)) kind='budget';
 else if(has(/ΕΙΔΙΚΗ ΣΥΓΓΡΑΦΗ ΥΠΟΧΡΕΩΣΕΩΝ|Ε\.?Σ\.?Υ\.?\b/)&&has(/ΑΡΘΡΟ/)&&has(/ΕΠΙ ΕΛΑΣ?Σ?ΟΝ|ΕΠΙ ΕΛΑΤΤΟΝ/)) kind='esy';
 else if(has(/ΣΥΜΦΩΝΗΤΙΚΟ|ΣΥΜΒΑΣΗ ΚΑΤΑΣΚΕΥΗΣ/)||has(/\d{2}SYMV\d{6}/)) kind='contract';
 else if(has(/ΤΕΧΝΙΚΟ ΣΥΜΒΟΥΛΙΟ/)||has(/ΓΝΩΜΟΔΟΤ/)) kind='techcouncil';
 else if(has(/ΑΝΑΛΗΨΗ[Σ]? ΥΠΟΧΡΕΩΣΗΣ|ΠΡΟΤΑΣΗ ΑΝΑΛΗΨΗΣ|ΔΕΣΜΕΥΣΗ ΠΙΣΤΩΣΗΣ/)) kind='commitment';
 else if(has(/ΠΑΡΑΤΑΣΗ[Σ]? (ΤΗΣ )?(ΣΥΜΒΑΤΙΚΗΣ )?ΠΡΟΘΕΣΜΙΑΣ|ΧΟΡΗΓΗΣΗ ΠΑΡΑΤΑΣΗΣ/)) kind='extension';
 else if(has(/ΚΑΤΑΚΥΡΩΣ|ΑΝΑΔΕΙΞΗ ΑΝΑΔΟΧΟΥ|ΑΝΑΘΕΣΗ ΤΟΥ ΕΡΓΟΥ|ΟΡΙΣΤΙΚΟΥ ΑΝΑΔΟΧΟΥ/)) kind='award';
 else if(has(/ΑΝΑΚΕΦΑΛΑΙΩΤΙΚΟ[ΥΝ]? ΠΙΝΑΚΑ|1ΟΥ Α\.?Π\.?Ε/)&&has(/ΕΓΚΡΙΣ/)) kind='apeApproval';
 else if(has(/ΕΓΚΡΙΣ/)&&has(/ΟΡΩΝ ΔΙΑΚΗΡΥΞΗΣ|ΟΡΩΝ ΔΗΜΟΠΡΑΤΗΣΗΣ|ΤΗΣ ΜΕΛΕΤΗΣ|ΤΕΧΝΙΚΩΝ ΠΡΟΔΙΑΓΡΑΦΩΝ/)) kind='terms';
 else if(has(/ΑΠΟΦΑΣΗ|ΑΠΟΣΠΑΣΜΑ ΠΡΑΚΤΙΚΟΥ/)) kind='decision';
 let auth=1;
 if(signed) auth=3; else if(kind!=='unknown'&&kind!=='decision') auth=2;
 return {kind,auth,signed};
}
/* όταν το είδος είναι γενική απόφαση, κρίνεται από το θέμα */
function refineByThema(kind,findings){
 if(kind!=='decision')return kind;
 const th=(findings.find(f=>f.type==='thema')||{}).value||'';
 const t=th.toUpperCase().replace(/[ΆΈΉΊΌΎΏ]/g,c=>({'Ά':'Α','Έ':'Ε','Ή':'Η','Ί':'Ι','Ό':'Ο','Ύ':'Υ','Ώ':'Ω'}[c]));
 if(/ΠΑΡΑΤΑΣ/.test(t))return'extension';
 if(/ΚΑΤΑΚΥΡΩΣ|ΑΝΑΘΕΣ|ΑΝΑΔΟΧΟΥ/.test(t))return'award';
 if(/ΑΝΑΛΗΨ|ΔΕΣΜΕΥΣ/.test(t))return'commitment';
 if(/ΓΝΩΜΟΔΟΤ|ΤΕΧΝΙΚΟΥ ΣΥΜΒΟΥΛΙΟΥ/.test(t))return'techcouncil';
 if(/ΑΝΑΚΕΦΑΛΑΙΩΤΙΚ/.test(t))return'apeApproval';
 if(/ΕΓΚΡΙΣ.*(ΜΕΛΕΤ|ΟΡΩΝ|ΔΙΑΚΗΡΥΞ|ΔΗΜΟΠΡΑΤ)/.test(t))return'terms';
 return'decision';
}
/* σε ποιο πεδίο κατατίθεται κάθε είδος εγγράφου */
const KINDFIELD={terms:'project.apofMeletis',award:'project.apofKatakyrwsis',
 techcouncil:'project.apofTS',commitment:'project.analipsi',extension:'project.paratasis'};

function findEsyArticle(txt){
 const i=txt.search(/επί\s*[έε]λασ?σ?ον|επί\s*[έε]λαττον/i);
 if(i<0)return'';
 const before=txt.slice(Math.max(0,i-4000),i);
 const ms=[...before.matchAll(/Άρθρο\s+(\d+[Α-Ωα-ω]?)/g)];
 return ms.length?('άρθρο '+ms[ms.length-1][1]+' της Ε.Σ.Υ.'):'';
}

let batchReport=null;
async function batchImport(ev){
 const files=[...(ev.target.files||[])]; ev.target.value='';
 if(!files.length)return;
 flashMsg={k:'info',t:'Ανάγνωση '+files.length+' εγγράφων…',d:'Παρακαλώ περιμένετε.'}; render();
 const docs=[];
 for(const f of files){
  try{
   let txt;
   if(/\.xlsx$/i.test(f.name)){ txt=(await xlsxToRows(await f.arrayBuffer())).map(r=>r.join('  ')).join('\n'); }
   else txt=/\.pdf$/i.test(f.name)?await pdfToText(await f.arrayBuffer()):await f.text();
   const c=classifyDoc(txt);
   const F=docScan(txt);
   c.kind=refineByThema(c.kind,F);
   docs.push({name:f.name,txt,F,...c,gave:[]});
  }catch(e){ docs.push({name:f.name,kind:'unknown',auth:0,F:[],gave:[],err:e.message||'σφάλμα ανάγνωσης'}); }
 }
 /* σειρά επεξεργασίας: πρώτα ο προϋπολογισμός (δημιουργεί τις ομάδες),
    μετά η προσφορά (χρειάζεται τις ομάδες), μετά οι αποφάσεις */
 const order={budget:0,offer:1,esy:2};
 docs.sort((a,b)=>(order[a.kind]??5)-(order[b.kind]??5)||b.auth-a.auth);

 const prop={};                                   // path -> [{v,src,auth}]
 const add=(p,v,src,auth)=>{ if(v==null||v==='')return;
  (prop[p]=prop[p]||[]).push({v:String(v),src,auth}); };

 let budgetLoaded=false, offerRep=null;
 for(const dc of docs){
  if(dc.err)continue;
  if(dc.kind==='budget'){
   const {groups,meta}=parseBudget(dc.txt);
   if(groups.length){ S.groups=groups; budgetLoaded=true;
    applyMeta(meta);
    dc.gave.push(groups.length+' ομάδες, '+groups.reduce((a,g)=>a+g.items.length,0)+' άρθρα');
    const q=meta.quality;
    if(q&&q.issues.length) dc.warn=q.issues.map(x=>x.t).join(' ');
    ['ergo','geoe','apr','fpa'].forEach(k=>{ if(meta[k]) dc.gave.push(k==='ergo'?'τίτλος έργου':k); });
   } else dc.warn='δεν αναγνωρίστηκαν άρθρα';
   continue;
  }
  if(dc.kind==='offer'){
   const o=parseOffer(dc.txt);
   if(o.isOffer&&S.groups.length){ offerRep=applyOffer(o);
    dc.gave.push('εκπτώσεις σε '+offerRep.filter(r=>r.ok).length+' ομάδες');
    if(o.anadoxos)dc.gave.push('ανάδοχος'); if(o.prosforaAA)dc.gave.push('Α/Α προσφοράς');
   } else if(!S.groups.length) dc.warn='χρειάζεται πρώτα ο προϋπολογισμός';
   continue;
  }
  if(dc.kind==='esy'){
   const a=findEsyArticle(dc.txt);
   if(a){ add('project.esy',a,dc.name,dc.auth); dc.gave.push('άρθρο Ε.Σ.Υ.'); }
   else dc.warn='δεν εντοπίστηκε άρθρο για «επί έλασσον»';
   continue;
  }
  /* αποφάσεις και λοιπά έγγραφα */
  const tgt=KINDFIELD[dc.kind];
  if(tgt){ const v=valueFor(tgt,dc.F); if(v){ add(tgt,v,dc.name,dc.auth); dc.gave.push((DOCFIELDS.find(x=>x.p===tgt)||{}).l); } }
  if(dc.kind==='contract'){
   const pr=firstOf(dc.F,'prot'), ad=firstOf(dc.F,'adam'), pth=firstOf(dc.F,'prothesmia'), dt=firstOf(dc.F,'date');
   if(pr){ add('project.arPrwtSymvasis',pr.value+(pr.extra?'/'+pr.extra:''),dc.name,dc.auth); dc.gave.push('αρ. πρωτ. σύμβασης');
           if(pr.extra) add('project.imSymvasis',pr.extra,dc.name,dc.auth); }
   else if(dt){ add('project.imSymvasis',dt.value,dc.name,dc.auth); }
   if(ad){ add('project.adam',ad.value,dc.name,dc.auth); dc.gave.push('ΑΔΑΜ'); }
   if(pth){ add('project.prothesmia',pth.value,dc.name,dc.auth); dc.gave.push('προθεσμία'); }
  }
  /* μονοσήμαντα αναγνωριστικά από οποιοδήποτε έγγραφο */
  [['project.esidis','esidis'],['project.prosforaAA','prosfora'],['project.afm','afm'],
   ['project.ka','ka'],['project.adam','adam']].forEach(([p,t])=>{
   const a=dc.F.filter(f=>f.type===t);
   if(a.length===1) add(p,a[0].value,dc.name,dc.auth);
  });
 }

 /* επίλυση: υπερισχύει η μεγαλύτερη βεβαιότητα */
 const filled=[], conflicts=[];
 Object.keys(prop).forEach(p=>{
  const list=prop[p].slice().sort((a,b)=>b.auth-a.auth);
  const win=list[0];
  const others=list.filter(x=>x.v!==win.v);
  const cur=getPath(p);
  if(!cur||win.auth>=3){
   if(cur&&cur!==win.v) conflicts.push({p,old:cur,v:win.v,src:win.src});
   setPath(p,win.v);
   filled.push({p,v:win.v,src:win.src,auth:win.auth});
  }
  if(others.length) conflicts.push({p,v:win.v,src:win.src,
    alt:others.map(o=>o.v+' ('+o.src+')').join(', ')});
 });

 docs.forEach(d=>{ if(!d.err) regDoc(d.name,(KINDFIELD[d.kind]||''),d.F||[],KINDS[d.kind]||d.kind,AUTH[d.auth]||''); });
 batchReport={docs,filled,conflicts,budgetLoaded,offerRep};
 flashMsg=null; tab='p1'; render(); openBatchPanel();
}

function openBatchPanel(){
 const r=batchReport; if(!r)return;
 const lbl=p=>(DOCFIELDS.find(x=>x.p===p)||{}).l||p;
 const badge=a=>a>=3?'<span class="st ok"><b></b>'+AUTH[3]+'</span>'
   :a===2?'<span class="st info"><b></b>'+AUTH[2]+'</span>'
   :a===1?'<span class="st warn"><b></b>'+AUTH[1]+'</span>'
   :'<span class="st bad"><b></b>Σφάλμα</span>';
 const drows=r.docs.map(d=>`<tr>
   <td style="max-width:230px;word-break:break-word">${E(d.name)}</td>
   <td>${E(KINDS[d.kind]||d.kind)}</td>
   <td>${badge(d.auth)}</td>
   <td class="hint">${d.err?E(d.err):(d.gave.length?E(d.gave.join(' · ')):'—')}${
     d.warn?'<br><span style="color:var(--warn)">⚠ '+E(d.warn)+'</span>':''}</td></tr>`).join('');
 const frows=r.filled.map(f=>`<tr><td>${E(lbl(f.p))}</td>
   <td style="font-family:var(--num)">${E(f.v)}</td>
   <td class="hint">${E(f.src)}</td></tr>`).join('');
 const empty=DOCFIELDS.filter(x=>!getPath(x.p)).map(x=>E(x.l));
 const conf=r.conflicts.filter(c=>c.alt).map(c=>
   `<li>${E(lbl(c.p))}: κρατήθηκε <b>${E(c.v)}</b> από «${E(c.src)}» — άλλες τιμές: ${E(c.alt)}</li>`).join('');
 $('modal').innerHTML=`<div class="mbox">
  <h3>Μαζική εισαγωγή — ${r.docs.length} έγγραφα
   <button class="btn gh sm" style="margin-left:auto" onclick="closeDocPanel()">Κλείσιμο</button></h3>
  <div class="mbody">
   <table class="t"><thead><tr><th>Αρχείο</th><th style="width:210px">Είδος</th>
     <th style="width:140px">Βεβαιότητα</th><th>Τι έδωσε</th></tr></thead><tbody>${drows}</tbody></table>
   ${r.filled.length?`<h4 style="font-size:13px;margin:18px 0 8px">Συμπληρώθηκαν ${r.filled.length} πεδία</h4>
     <table class="t"><thead><tr><th style="width:270px">Πεδίο</th><th>Τιμή</th><th style="width:200px">Πηγή</th></tr></thead>
     <tbody>${frows}</tbody></table>`:'<div class="note w" style="margin-top:16px">Δεν συμπληρώθηκε κανένα πεδίο από τα έγγραφα.</div>'}
   ${conf?`<div class="note w" style="margin-top:16px"><b>Διαφορετικές τιμές μεταξύ εγγράφων</b><ul style="margin:6px 0 0;padding-left:18px">${conf}</ul></div>`:''}
   ${empty.length?`<div class="note" style="margin-top:16px"><b>Παραμένουν κενά ${empty.length} πεδία:</b> ${empty.join(' · ')}.
     <br>Συμπληρώστε τα με το 📎 του κάθε πεδίου ή χειροκίνητα.</div>`
    :'<div class="note g" style="margin-top:16px">Όλα τα πεδία του βήματος 1 συμπληρώθηκαν.</div>'}
  </div></div>`;
 $('modal').style.display='flex';
}
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   ΕΛΕΓΧΟΣ ΑΠΕ ΤΡΙΤΟΥ
   Διαβάζει έτοιμο Ανακεφαλαιωτικό Πίνακα και φύλλα αναθεώρησης,
   ξαναϋπολογίζει τα πάντα ανεξάρτητα και συγκρίνει με τα δηλωθέντα.
   ══════════════════════════════════════════════════════════════ */
const NUMT=/\d{1,3}(?:\.\d{3})*,\d{2}|\d+(?:,\d+)?/g;
const nums=l=>{const o=[];let m;const r=new RegExp(NUMT.source,'g');
 while((m=r.exec(l))) o.push({v:gr(m[0]),raw:m[0],i:m.index}); return o;};
const near=(a,b,t)=>Math.abs(a-b)<=(t==null?0.02:t);

function parseApeDoc(txt){
 const raw=txt.split(/\r?\n/);
 const L=raw.map(x=>x.replace(/\s+/g,' ').trim());
 const R={articles:[],groups:[],fin:{},warn:[]};
 let desc=[], gname='', curG=null;

 L.forEach((line,li)=>{
  if(!line) return;
  let m;
  /* ── ομάδες και οικονομικά ── */
  if(/Αφαιρ/.test(line)&&(m=line.match(/(\d{1,2}(?:,\d+)?)\s*%/))){
   const n=nums(line).filter(x=>x.v!==gr(m[1]));
   /* Η γραμμή της έκπτωσης κλείνει την ομάδα: το επόμενο άρθρο ανοίγει νέα. */
   if(curG){ curG.discount=gr(m[1]); curG.discAmt=n.length?Math.abs(n[0].v):0; curG=null; }
   return;
  }
  if(/Ενιαίο όφελος/.test(line)&&(m=line.match(/(\d{1,2}(?:,\d+)?)\s*%/))){
   const n=nums(line).filter(x=>x.v!==gr(m[1]));
   R.fin.geoeRate=gr(m[1]);
   if(n.length>=2){R.fin.geoeC=n[0].v;R.fin.geoeA=n[1].v;}
   return;
  }
  if(/Ενιαί.{0,3}\s*απρόβλεπτ/i.test(line)){
   const n=nums(line); if(n.length>=2){R.fin.aprC=n[0].v;R.fin.aprA=n[1].v;} return;
  }
  if(/Απολογιστικ/i.test(line)){ const n=nums(line); if(n.length>=1)R.fin.apol=n[0].v; return; }
  if(/Ανα.{0,2}εώρ/i.test(line)){ const n=nums(line); if(n.length>=2){R.fin.anathC=n[0].v;R.fin.anathA=n[1].v;} return; }
  if(/Φ\.?Π\.?Α/i.test(line)&&(m=line.match(/(\d{1,2}(?:,\d+)?)\s*%/))){
   const n=nums(line).filter(x=>x.v!==gr(m[1]));
   R.fin.fpaRate=gr(m[1]); if(n.length>=2){R.fin.fpaC=n[0].v;R.fin.fpaA=n[1].v;} return;
  }
  if(/ΣΥΜΒΑΤΙΚΟ ΠΟΣΟ/i.test(line)){const n=nums(line);if(n.length>=2){R.fin.symC=n[0].v;R.fin.symA=n[1].v;}return;}
  if(/ΣΥΝΟΛΙΚΑ ΠΟΣΑ ΧΩΡΙΣ/i.test(line)){const n=nums(line);if(n.length>=2){R.fin.netC=n[0].v;R.fin.netA=n[1].v;}return;}
  if(/ΣΥΝΟΛΙΚΟ ΠΟΣΟ/i.test(line)){const n=nums(line);if(n.length>=2){R.fin.totC=n[0].v;R.fin.totA=n[1].v;}return;}
  if(/Μερικό Σύνολο/i.test(line)){
   const n=nums(line);
   if(curG&&curG.subC==null&&n.length>=2){curG.subC=n[0].v;curG.subA=n[1].v;gname='';}
   else if(n.length>=2){R.fin.blocks=R.fin.blocks||[];R.fin.blocks.push(n.map(x=>x.v));}
   desc=[]; return;
  }
  /* ── γραμμή άρθρου ──
     Η περιγραφή συχνά τυπώνεται στην ίδια γραμμή πριν από τα μεγέθη,
     γι' αυτό η αγκύρωση γίνεται στην αριθμητική ουρά: Α.Τ. + μονάδα + αριθμοί. */
  m=line.match(/(?:^|\s)(\d{1,3})\s+([A-Za-zΑ-Ωα-ω0-9²³.\/]{1,6})\s+((?:[\d.,]+[\s]*){3,})$/);
  if(m&&/\d,\d{2}/.test(m[3])){
   const at=m[1], mon=m[2], N=nums(m[3]);
   if(line.slice(0,m.index).trim()) desc.push(line.slice(0,m.index).trim());
   const art=solveArticle(N);
   if(art){
    if(!curG){curG={name:gname||'Ομάδα 1',items:[]};R.groups.push(curG);}
    art.at=at; art.monada=mon;
    art.perigrafi=desc.slice(-4).join(' ').replace(/^\d+\s+/,'').trim()||('Άρθρο '+at);
    curG.items.push(art); R.articles.push(art);
   }
   desc=[]; return;
  }
  /* ── τίτλος ομάδας ── */
  if(/^\d{1,2}\.\s*$/.test(line)){ curG=null; return; }
  if(/^[Α-Ω][Α-Ωα-ω\s\-().]{6,60}$/.test(line)&&!/Σελίδα|ErgoLand|Μερικό|Είδος/.test(line)){
   gname=line;
  }
  if(/^\s*\d?\s*[Α-Ωα-ω]/.test(line)&&line.length>3&&!/Σελίδα|ErgoLand/.test(line)) desc.push(line);
 });
 /* ονόματα ομάδων που δεν βρέθηκαν */
 R.groups.forEach((g,i)=>{ if(!g.name)g.name='Ομάδα '+(i+1); });
 return R;
}

/* Οι στήλες του πίνακα ενώνονται συχνά κατά την εξαγωγή, γι' αυτό η
   αναγνώριση γίνεται αριθμητικά: αναζητείται ποσότητα × τιμή = δαπάνη. */
function solveArticle(N){
 const v=N.map(x=>x.v);
 /* Στον πίνακα η ποσότητα τυπώνεται πάντοτε πριν από την τιμή μονάδας,
    οπότε η θέση ξεχωρίζει ποιο μέγεθος είναι ποιο. */
 const trip=[];
 for(let i=0;i<v.length;i++) for(let j=i+1;j<v.length;j++){
  if(!v[j]||!v[i])continue;
  for(let k=0;k<v.length;k++){
   if(k===i||k===j)continue;
   if(v[k]>0&&near(R2(v[i]*v[j]),v[k])) trip.push({q:v[i],qi:i,p:v[j],c:v[k],ki:k});
  }
 }
 if(!trip.length)return null;
 const cnt={}; v.forEach(x=>{cnt[x]=(cnt[x]||0)+1;});
 // η τιμή μονάδας επαναλαμβάνεται (σύμβαση και Α.Π.Ε.) και συνήθως έχει δεκαδικά
 let price=null,score=-1;
 trip.forEach(t=>{
  const sc=(cnt[t.p]||0)*2+((t.p%1)?1:0);
  if(sc>score){score=sc;price=t.p;}
 });
 const withP=trip.filter(t=>near(t.p,price,0.001));
 if(!withP.length)return null;
 const pairs=[];
 withP.sort((a,b)=>a.qi-b.qi).forEach(t=>{
  if(!pairs.some(x=>near(x.q,t.q,0.0001)&&near(x.c,t.c))) pairs.push({q:t.q,c:t.c,i:t.qi});
 });
 let qc,costC,qa,costA;
 if(pairs.length>=2){ qc=pairs[0].q; costC=pairs[0].c; qa=pairs[1].q; costA=pairs[1].c; }
 else { qc=pairs[0].q; costC=pairs[0].c;
        if(v.some(x=>x===0)){ qa=0; costA=0; } else { qa=qc; costA=costC; } }
 return{qc,qa,price,costC:R2(costC),costA:R2(costA),delta:R2(costA-costC),decl:v.slice()};
}

/* ── έλεγχος ── */
function auditApe(D){
 const f=[], add=(sev,area,what,decl,calc,note)=>f.push({sev,area,what,decl,calc,note:note||''});
 const geoe=(D.fin.geoeRate!=null?D.fin.geoeRate:18)/100;
 const fpa=(D.fin.fpaRate!=null?D.fin.fpaRate:24)/100;

 /* 1. αριθμητική άρθρων */
 let bad=0;
 D.articles.forEach(a=>{
  if(!near(R2(a.qc*a.price),a.costC)){bad++;add('err','Άρθρα','Α.Τ. '+a.at+': ποσότητα × τιμή σύμβασης',F(a.costC),F(R2(a.qc*a.price)));}
  if(!near(R2(a.qa*a.price),a.costA)){bad++;add('err','Άρθρα','Α.Τ. '+a.at+': ποσότητα × τιμή Α.Π.Ε.',F(a.costA),F(R2(a.qa*a.price)));}
 });
 if(!bad&&D.articles.length) add('ok','Άρθρα','Αριθμητική '+D.articles.length+' άρθρων',
  'σωστή','σωστή','Κάθε γραμμή επαληθεύτηκε: ποσότητα × τιμή = δαπάνη.');

 /* 2. σύνολα ομάδων και εκπτώσεις */
 D.groups.forEach((g,i)=>{
  const sc=R2(g.items.reduce((a,x)=>a+x.costC,0));
  const sa=R2(g.items.reduce((a,x)=>a+x.costA,0));
  if(g.subC!=null&&!near(sc,g.subC)) add('err','Ομάδες','Ομάδα '+(i+1)+': άθροισμα σύμβασης',F(g.subC),F(sc));
  if(g.subA!=null&&!near(sa,g.subA)) add('err','Ομάδες','Ομάδα '+(i+1)+': άθροισμα Α.Π.Ε.',F(g.subA),F(sa));
  if(g.discount!=null&&g.discAmt!=null){
   const d=R2((g.subC!=null?g.subC:sc)*g.discount/100);
   if(!near(d,g.discAmt)) add('err','Ομάδες','Ομάδα '+(i+1)+': ποσό έκπτωσης '+F(g.discount)+'%',F(g.discAmt),F(d));
   else add('ok','Ομάδες','Ομάδα '+(i+1)+': έκπτωση '+F(g.discount)+'%',F(g.discAmt),F(d));
  }
 });

 /* 3. οικονομική δομή */
 const fin=D.fin;
 const worksC=R2(D.groups.reduce((a,g)=>a+((g.subC!=null?g.subC:0)-(g.discAmt||0)),0));
 const worksA=R2(D.groups.reduce((a,g)=>{
   const sa=g.subA!=null?g.subA:R2(g.items.reduce((x,y)=>x+y.costA,0));
   const dA=g.discount!=null?R2(sa*g.discount/100):0; return a+sa-dA;},0));
 if(fin.geoeC!=null){
  const gc=R2(worksC*geoe);
  if(!near(gc,fin.geoeC,0.05)) add('warn','Οικονομικά','Γ.Ε. & Ο.Ε. '+F(fin.geoeRate)+'% επί της σύμβασης',F(fin.geoeC),F(gc));
  else add('ok','Οικονομικά','Γ.Ε. & Ο.Ε. '+F(fin.geoeRate)+'%',F(fin.geoeC),F(gc));
 }
 if(fin.symC!=null&&fin.aprC!=null){
  const s=R2(R2(worksC*(1+geoe))+fin.aprC);
  if(!near(s,fin.symC,0.05)) add('err','Οικονομικά','Συμβατικό ποσό (εργασίες + απρόβλεπτα)',F(fin.symC),F(s));
  else add('ok','Οικονομικά','Συμβατικό ποσό',F(fin.symC),F(s));
 }
 if(fin.aprC!=null&&fin.aprA!=null&&fin.symC!=null){
  const rate=fin.symC?R2((fin.aprC/(fin.symC-fin.aprC))*100):0;
  if(!near(rate,9,0.6)&&!near(rate,15,0.6))
   add('warn','Οικονομικά','Ποσοστό απροβλέπτων',P(rate),'9% ή 15%',
    'Το άρθρο 156 §3β΄ ορίζει 9% για έργα άνω των ενωσιακών ορίων και 15% για τα υπόλοιπα.');
  else add('ok','Οικονομικά','Ποσοστό απροβλέπτων',P(rate),P(rate));
 }
 if(fin.netA!=null&&fin.symA!=null){
  const n=R2(fin.symA+(fin.apol||0)+(fin.anathA||0));
  if(!near(n,fin.netA,0.05)) add('err','Οικονομικά','Σύνολο χωρίς Φ.Π.Α.',F(fin.netA),F(n));
  else add('ok','Οικονομικά','Σύνολο χωρίς Φ.Π.Α.',F(fin.netA),F(n));
 }
 if(fin.fpaA!=null&&fin.netA!=null){
  const v=R2(fin.netA*fpa);
  if(!near(v,fin.fpaA,0.05)) add('err','Οικονομικά','Φ.Π.Α. '+F(fin.fpaRate)+'%',F(fin.fpaA),F(v));
  else add('ok','Οικονομικά','Φ.Π.Α. '+F(fin.fpaRate)+'%',F(fin.fpaA),F(v));
 }
 if(fin.totA!=null&&fin.netA!=null&&fin.fpaA!=null){
  const t=R2(fin.netA+fin.fpaA);
  if(!near(t,fin.totA,0.05)) add('err','Οικονομικά','Γενικό σύνολο',F(fin.totA),F(t));
  else add('ok','Οικονομικά','Γενικό σύνολο',F(fin.totA),F(t));
 }

 /* 4. νομιμότητα — ανεξάρτητος υπολογισμός των ορίων */
 const g1=1+geoe;
 let plus=0,minus=0,maxPct=0,over=0,eli=0,transfer=0;
 const gres=D.groups.map((g,i)=>{
  const fdisc=1-((g.discount||0)/100);
  const p=R2(R2(g.items.reduce((a,x)=>a+Math.max(0,x.delta),0))*fdisc*g1);
  const mi=R2(R2(g.items.reduce((a,x)=>a+Math.max(0,-x.delta),0))*fdisc*g1);
  const base=R2(R2((g.subC!=null?g.subC:0))*fdisc*g1);
  return{name:g.name||('Ομάδα '+(i+1)),p,mi,base,intra:R2(Math.min(p,mi)),
   ni:R2(Math.max(0,p-mi)),nd:R2(Math.max(0,mi-p))};
 });
 plus=R2(gres.reduce((a,x)=>a+x.p,0)); minus=R2(gres.reduce((a,x)=>a+x.mi,0));
 const ti=R2(gres.reduce((a,x)=>a+x.ni,0)), td=R2(gres.reduce((a,x)=>a+x.nd,0));
 transfer=R2(Math.min(ti,td));
 gres.forEach(x=>{ x.cross=td>0?R2(transfer*x.nd/td):0; x.used=R2(x.intra+x.cross);
  eli+=x.used; x.pct=x.base?x.used/x.base*100:0; x.lim=R2(x.base*0.20);
  x.over=x.used>x.lim?R2(x.used-x.lim):0;
  if(x.pct>maxPct)maxPct=x.pct; over+=x.over; });
 eli=R2(eli); over=R2(over);
 const conGE=R2(worksC*g1);
 const pct10=conGE?transfer/conGE*100:0;
 const aprNeed=R2(Math.max(0,plus-eli));

 add(maxPct>20?'err':'ok','Νομιμότητα','Όριο 20% ανά ομάδα (άρθρο 156 §3γε΄)',
  '—',P(maxPct),maxPct>20?('Υπέρβαση '+F(over)+' € — το υπερβάλλον μειώνει την αξία της σύμβασης.'):'Εντός ορίου.');
 add(pct10>10?'err':'ok','Νομιμότητα','Όριο 10% μεταφορών μεταξύ ομάδων','—',P(pct10),
  'Μεταφερόμενη δαπάνη '+F(transfer)+' €.');
 if(fin.aprC!=null){
  const rest=R2(fin.aprC-aprNeed);
  const okA=fin.aprA==null||near(rest,fin.aprA,0.05);
  add(rest<0?'err':(okA?'ok':'warn'),'Νομιμότητα','Χρήση κονδυλίου απροβλέπτων',
   fin.aprA!=null?F(fin.aprA):'—',F(rest),
   rest<0?('Ακάλυπτο ποσό '+F(-rest)+' € — απαιτείται τροποποίηση της σύμβασης.')
        :('Χρησιμοποιούνται '+F(aprNeed)+' € από '+F(fin.aprC)+' €.'));
 }
 add(eli>0?'warn':'ok','Νομιμότητα','Σύμφωνη γνώμη Τεχνικού Συμβουλίου',
  '—',eli>0?'ΑΠΑΙΤΕΙΤΑΙ':'δεν προκύπτει',
  eli>0?('Γίνεται χρήση «επί έλασσον» δαπανών '+F(eli)+' €. Το τελευταίο εδάφιο της περ. γ΄ της παρ. 3 του άρθρου 156 την απαιτεί σε κάθε περίπτωση.'):'');
 if(fin.symC!=null&&fin.symA!=null){
  const dpct=fin.symC?R2((fin.symA-fin.symC)/fin.symC*100):0;
  add(Math.abs(dpct)>15?'err':'ok','Νομιμότητα','Συμβατική μεταβολή','—',P(dpct),
   Math.abs(dpct)>15?'Υπέρβαση του ορίου 15% της περ. α΄ της παρ. 3 του άρθρου 156.':'Εντός του ορίου 15%.');
 }
 const killed=D.groups.filter(g=>g.subC>0&&R2(g.items.reduce((a,x)=>a+x.costA,0))===0);
 if(killed.length) add('err','Νομιμότητα','Κατάργηση ομάδας εργασιών','—',killed.length+' ομάδες',
  'Η υποπερ. γβ΄ απαγορεύει την κατάργηση ομάδας εργασιών.');
 const zeroed=D.articles.filter(a=>a.qc>0&&a.qa===0).length;
 if(zeroed) add('warn','Νομιμότητα','Μηδενισμός άρθρων τιμολογίου','—',zeroed+' άρθρα',
  'Τίθεται υπόψη του Τεχνικού Συμβουλίου ως ζήτημα «βασικού σχεδίου».');

 return{findings:f,summary:{plus,minus,eli,transfer,maxPct,over,pct10,aprNeed,worksC,worksA,gres}};
}

/* ── αναθεώρηση ── */
function auditRevision(txt,name){
 const N=txt.replace(/\s+/g,' ');
 const f=[]; const add=(sev,what,decl,calc,note)=>f.push({sev,area:'Αναθεώρηση',what,decl,calc,note:note||''});
 let m, sigma=null, nu=null;
 if((m=N.match(/(?:^|\s)σ\s*=\s*([01](?:[.,]\d+)?)/))) sigma=gr(m[1]);
 if((m=N.match(/ν\s*=\s*(\d{1,2})/))) nu=+m[1];
 if((m=N.match(/1\s*[-−]\s*σ\s*[=:]?\s*([01][.,]\d+)/))){
  const oneMinus=gr(m[1]);
  if(sigma!=null&&!near(1-sigma,oneMinus,0.005))
   add('err','Συντελεστής (1 − σ)',String(oneMinus).replace('.',','),String(R2(1-sigma)).replace('.',','),
    'Ο τύπος του άρθρου 153 §6 είναι ΔΤν = Τ × (Αν/Αο − 1) × (1 − σ).');
  else add('ok','Συντελεστής (1 − σ)',String(oneMinus).replace('.',','),String(R2(1-sigma)).replace('.',','));
 }
 const s1=Number(S.anath.sigma1)||0.07;
 if(nu!=null){
  const exp=Math.min(R2(s1+0.01*nu),0.20);
  if(sigma!=null&&!near(sigma,exp,0.005))
   add('err','σ για ν = '+nu,String(sigma).replace('.',','),String(exp).replace('.',','),
    'σ = σ₁ + 0,01·ν με σ₁ = '+String(s1).replace('.',',')+' και ανώτατη τιμή 0,20 (άρθρο 153 §7).');
  else if(sigma!=null) add('ok','σ για ν = '+nu,String(sigma).replace('.',','),String(exp).replace('.',','));
  if(sigma!=null&&sigma>0.2001) add('err','Πλαφόν σ','—','0,20','Το ν παύει να αυξάνει όταν το σ γίνει 0,20.');
 }
 /* έλεγχος πολλαπλασιαστή: αναζήτηση σχέσης (αναθεωρημένη − βάση) × k = αποτέλεσμα */
 const V=nums(N).map(x=>x.v).filter(x=>x>1);
 let found=false;
 for(let i=0;i<V.length&&!found;i++) for(let j=i+1;j<V.length&&!found;j++){
  const d=V[j]-V[i]; if(d<=1)continue;
  for(let k=0;k<V.length;k++){
   if(k===i||k===j)continue;
   if(sigma!=null&&near(R2(d*(1-sigma)),V[k],0.6)){
    add('ok','Πολλαπλασιαστής δαπάνης','(1 − σ) = '+String(R2(1-sigma)).replace('.',','),
     'σωστός','('+F(V[j])+' − '+F(V[i])+') × '+String(R2(1-sigma)).replace('.',',')+' = '+F(V[k]));
    found=true;break;
   }
   if(sigma!=null&&sigma<0.5&&near(R2(d*sigma),V[k],0.6)){
    add('err','Πολλαπλασιαστής δαπάνης','σ = '+String(sigma).replace('.',','),
     '(1 − σ) = '+String(R2(1-sigma)).replace('.',','),
     'Η δαπάνη πολλαπλασιάστηκε με σ αντί για (1 − σ). Η αναθεώρηση υπολογίζεται '+
     R2((1-sigma)/sigma)+' φορές μικρότερη από τη νόμιμη.');
    found=true;break;
   }
  }
 }
 if(!f.length) add('warn','Ανάγνωση φύλλου','—','—','Δεν εντοπίστηκαν συντελεστές στο «'+name+'».');
 return f;
}

/* ════════════════ ΔΙΕΠΑΦΗ ΕΛΕΓΧΟΥ ════════════════ */
let auditData=null, auditFind=[], auditSum=null, auditNames=[];

async function loadAuditFile(ev){
 const files=[...(ev.target.files||[])]; ev.target.value='';
 if(!files.length)return;
 flashMsg={k:'info',t:'Ανάγνωση '+files.length+' αρχείων…',d:''}; render();
 try{
  for(const f of files){
   const txt=/\.pdf$/i.test(f.name)?await pdfToText(await f.arrayBuffer()):await f.text();
   const isRev=/ΑΝΑΘΕΩΡΗΣ|Αναθεώρησ/i.test(txt)&&!/Επί πλέον|Επί έλαττον/i.test(txt);
   if(isRev){
    auditFind=auditFind.concat(auditRevision(txt,f.name).map(x=>({...x,src:f.name})));
    auditNames.push(f.name+' — φύλλο αναθεώρησης');
   }else{
    const D=parseApeDoc(txt);
    if(!D.articles.length){ auditFind.push({sev:'warn',area:'Ανάγνωση',what:'Δεν αναγνωρίστηκαν άρθρα στο «'+f.name+'»',
      decl:'—',calc:'—',note:'Ελέγξτε ότι το αρχείο είναι ο Πίνακας και όχι σαρωμένη εικόνα.',src:f.name}); continue; }
    auditData=D; auditNames.push(f.name+' — Ανακεφαλαιωτικός Πίνακας ('+D.articles.length+' άρθρα)');
    const A=auditApe(D);
    auditFind=A.findings.map(x=>({...x,src:f.name})).concat(auditFind);
    auditSum=A.summary;
   }
  }
  flashMsg=null; tab='p8'; render();
 }catch(e){ flashMsg={k:'b',t:'Δεν ήταν δυνατή η ανάγνωση.',d:e.message||''}; render(); }
}
function clearAudit(){ auditData=null; auditFind=[]; auditSum=null; auditNames=[]; render(); }

/* Μεταφορά των ελεγμένων στοιχείων στο έργο, ώστε να συνταχθούν τα έγγραφα. */
function adoptAudit(){
 if(!auditData)return;
 if(!confirm('Τα άρθρα και τα ποσοστά του ελεγμένου Πίνακα θα αντικαταστήσουν τα δεδομένα του τρέχοντος έργου.\n\nΣυνέχεια;'))return;
 const D=auditData, keep=S.project;
 S.groups=D.groups.map((g,i)=>({id:uid(),name:g.name||('Ομάδα '+(i+1)),discount:g.discount||0,
  items:g.items.map(a=>({id:uid(),at:String(a.at),kodikos:'',perigrafi:a.perigrafi||'',kodAnath:'',
   monada:a.monada||'',posotita:a.qc,timi:a.price,posotitaApe:a.qa,posotitaPrev:a.qc}))}));
 if(D.fin.geoeRate!=null) keep.geoe=D.fin.geoeRate;
 if(D.fin.fpaRate!=null) keep.fpa=D.fin.fpaRate;
 if(D.fin.apol!=null) keep.apologistika=D.fin.apol;
 if(D.fin.anathC!=null) keep.anathProv=D.fin.anathC;
 if(D.fin.symC!=null&&D.fin.aprC!=null){
  const w=D.fin.symC-D.fin.aprC;
  if(w>0) keep.apr=R2(D.fin.aprC/w*100);
 }
 const c=calc();
 flashMsg={k:'g',t:'Τα στοιχεία του ελεγμένου Πίνακα υιοθετήθηκαν.',
  d:'Η εφαρμογή υπολογίζει τώρα γενικό σύνολο '+F(c.totApe)+' €. Μπορείτε να προχωρήσετε στα έγγραφα του βήματος 8.'};
 tab='p4'; libSave(); render();
}

<script src="config.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   ΣΥΝΔΕΣΗ ΚΑΙ ΣΥΓΧΡΟΝΙΣΜΟΣ

   Μιλά απευθείας με το REST API του Supabase μέσω fetch. Δεν φορτώνεται
   βιβλιοθήκη: η εφαρμογή παραμένει ένα αρχείο χωρίς καμία εξάρτηση, όπως
   είναι και ο αναγνώστης PDF και ο writer του Excel.

   Η τοπική αποθήκευση παραμένει η κύρια πηγή. Ο συγχρονισμός είναι επιπλέον
   στρώμα: μηχανικός σε εργοτάξιο χωρίς σήμα συνεχίζει να δουλεύει κανονικά.
   ══════════════════════════════════════════════════════════════════ */

/* Συμπληρώνεται μετά τη δημιουργία του Supabase project.
   Το anon key ΔΕΝ είναι μυστικό — προορίζεται για τον browser και η
   πρόσβαση ελέγχεται αποκλειστικά από τις πολιτικές RLS. */
const SB_URL  = window.APE_SUPABASE_URL  || '';
const SB_ANON = window.APE_SUPABASE_ANON || '';
const SB_ON   = !!(SB_URL && SB_ANON);

const SESS_KEY = 'ape_session_v1';
let sbSession = null;          // {access_token, refresh_token, expires_at, user}
let syncState = {busy:false, last:null, error:null, pending:0};

/* ── αποθήκευση συνεδρίας ─────────────────────────────────────────── */
function sessSave(s){
 sbSession = s;
 try{ s ? localStorage.setItem(SESS_KEY, JSON.stringify(s))
        : localStorage.removeItem(SESS_KEY); }catch(e){}
}
function sessLoad(){
 try{ const r=localStorage.getItem(SESS_KEY); if(r) sbSession=JSON.parse(r); }catch(e){}
 return sbSession;
}
const sessValid = () => !!(sbSession && sbSession.access_token
  && (sbSession.expires_at||0)*1000 > Date.now()+60000);

/* ── κλήσεις ──────────────────────────────────────────────────────── */
async function sbCall(path, opts={}, auth=true){
 if(!SB_ON) throw new Error('Δεν έχει ρυθμιστεί η σύνδεση με τη βάση.');
 if(auth && !sessValid() && sbSession && sbSession.refresh_token) await sbRefresh();
 const h = Object.assign({'apikey':SB_ANON,'Content-Type':'application/json'}, opts.headers||{});
 if(auth && sbSession) h['Authorization']='Bearer '+sbSession.access_token;
 const r = await fetch(SB_URL.replace(/\/$/,'')+path, Object.assign({}, opts, {headers:h}));
 const txt = await r.text();
 let body=null; try{ body = txt?JSON.parse(txt):null; }catch(e){ body=txt; }
 if(!r.ok){
  const msg=(body&&(body.msg||body.message||body.error_description||body.error))||('HTTP '+r.status);
  const err=new Error(msg); err.status=r.status; err.body=body; throw err;
 }
 return body;
}

async function sbRefresh(){
 if(!sbSession||!sbSession.refresh_token) return false;
 try{
  const d=await sbCall('/auth/v1/token?grant_type=refresh_token',
    {method:'POST',body:JSON.stringify({refresh_token:sbSession.refresh_token})}, false);
  sessSave({access_token:d.access_token, refresh_token:d.refresh_token,
            expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600), user:d.user});
  return true;
 }catch(e){ sessSave(null); return false; }
}

async function sbSignIn(email, password){
 const d=await sbCall('/auth/v1/token?grant_type=password',
   {method:'POST',body:JSON.stringify({email,password})}, false);
 sessSave({access_token:d.access_token, refresh_token:d.refresh_token,
           expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600), user:d.user});
 return d.user;
}
async function sbSignOut(){
 try{ await sbCall('/auth/v1/logout',{method:'POST'}); }catch(e){}
 sessSave(null);
}
async function sbResetPassword(email){
 await sbCall('/auth/v1/recover',{method:'POST',body:JSON.stringify({email})}, false);
}

/* ── συγχρονισμός έργων ───────────────────────────────────────────── */
/* Κάθε τοπικό έργο κρατά remoteId και remoteRev. Το remoteRev είναι η έκδοση
   που είδαμε τελευταία φορά από τον διακομιστή· αν εκεί έχει προχωρήσει,
   κάποιος άλλος έγραψε στο μεταξύ και ΔΕΝ γράφουμε από πάνω του. */

async function syncPull(){
 const rows = await sbCall('/rest/v1/projects?select=id,title,data,revision,updated_at,owner_id&order=updated_at.desc');
 let added=0, updated=0;
 for(const row of rows){
  const local = LIB.find(x=>x.remoteId===row.id);
  if(!local){
   LIB.push({id:uid(), remoteId:row.id, remoteRev:row.revision, ownerId:row.owner_id,
             name:row.title||'Έργο', updated:new Date(row.updated_at).toLocaleString('el-GR'),
             data:normalize(row.data)});
   added++;
  } else if(row.revision > (local.remoteRev||0) && !local.dirty){
   /* Ο διακομιστής έχει νεότερη έκδοση και εμείς δεν έχουμε αναποθήκευτες
      αλλαγές — παίρνουμε τη δική του. */
   local.data = normalize(row.data);
   local.name = row.title||local.name;
   local.remoteRev = row.revision;
   local.updated = new Date(row.updated_at).toLocaleString('el-GR');
   if(local.id===curId) S = local.data;
   updated++;
  }
 }
 return {added, updated, total:rows.length};
}

async function syncPushOne(entry){
 const title = (entry.data&&entry.data.project&&entry.data.project.ergo) || entry.name || 'Νέο έργο';
 const payload = JSON.parse(JSON.stringify(entry.data, noCache));

 if(!entry.remoteId){
  const row = await sbCall('/rest/v1/projects',
    {method:'POST', headers:{'Prefer':'return=representation'},
     body:JSON.stringify({owner_id:sbSession.user.id, title, data:payload})});
  const r = Array.isArray(row)?row[0]:row;
  entry.remoteId=r.id; entry.remoteRev=r.revision; entry.ownerId=r.owner_id; entry.dirty=false;
  return {created:true};
 }

 /* Αισιόδοξο κλείδωμα: η ενημέρωση περνά μόνο αν η έκδοση στον διακομιστή
    είναι ακόμη αυτή που ξέραμε. Αλλιώς επιστρέφει 0 γραμμές και το
    αναφέρουμε αντί να σβήσουμε τη δουλειά του άλλου. */
 const rows = await sbCall(
   `/rest/v1/projects?id=eq.${entry.remoteId}&revision=eq.${entry.remoteRev||1}`,
   {method:'PATCH', headers:{'Prefer':'return=representation'},
    body:JSON.stringify({title, data:payload})});
 const r = Array.isArray(rows)?rows[0]:rows;
 if(!r) return {conflict:true};
 entry.remoteRev=r.revision; entry.dirty=false;
 return {updated:true};
}

/* Έχει το έργο περιεχόμενο που αξίζει να ανέβει;
   Χωρίς αυτό, κάθε νέα συνεδρία ανέβαζε το κενό «Νέο έργο» που δημιουργεί η
   εκκίνηση, και η βάση γέμιζε άδεια έργα. Μόλις ένα έργο ανέβει έστω μία
   φορά συνεχίζει να συγχρονίζεται κανονικά, ακόμη κι αν αδειάσει. */
function entryHasContent(e){
 const d=e&&e.data; if(!d) return false;
 if((d.groups||[]).length) return true;
 if((d.anath&&d.anath.periods||[]).length) return true;
 if((d.versions||[]).length || (d.docs||[]).length) return true;
 const b=blank().project, p=d.project||{};
 return Object.keys(p).some(k=>{
  const v=p[k]; return v!==b[k] && v!=='' && v!=null;
 });
}

async function syncAll(){
 if(!SB_ON || !sessValid()) return null;
 if(syncState.busy) return null;
 syncState.busy=true; syncState.error=null; renderSyncBar();
 try{
  libSave();
  const pull = await syncPull();
  const conflicts=[]; let pushed=0;
  for(const e of LIB){
   /* Ανεβαίνουν μόνο τα δικά μας έργα: στα ξένα δεν έχουμε δικαίωμα εγγραφής. */
   if(e.remoteId && e.ownerId && e.ownerId!==sbSession.user.id) continue;
   if(e.remoteId && !e.dirty) continue;
   if(!e.remoteId && !entryHasContent(e)) continue;
   const r = await syncPushOne(e);
   if(r.conflict) conflicts.push(e.name); else pushed++;
  }
  syncState.last=new Date(); syncState.pending=0;
  libSave();
  return {pull, pushed, conflicts};
 }catch(err){
  syncState.error = err.message||'σφάλμα συγχρονισμού';
  throw err;
 }finally{
  syncState.busy=false; renderSyncBar(); renderProjBar();
 }
}

/* Σημειώνει ότι το τρέχον έργο έχει αλλάξει και χρειάζεται ανέβασμα. */
function markDirty(){
 const e=LIB.find(x=>x.id===curId);
 if(e && !e.dirty){ e.dirty=true; syncState.pending++; renderSyncBar(); }
}

/* ── οθόνη σύνδεσης ───────────────────────────────────────────────── */

/* ── ορισμός κωδικού από πρόσκληση ή επαναφορά ──────────────────────
   Το «Invite user» του Supabase ΔΕΝ δημιουργεί κωδικό: στέλνει σύνδεσμο που
   περιέχει έτοιμη συνεδρία στο fragment της διεύθυνσης. Ο χρήστης φτάνει
   συνδεδεμένος αλλά χωρίς κωδικό — και αν η εφαρμογή δεν διαβάσει το
   fragment, δεν βλέπει τίποτα και δεν μπορεί να ξαναμπεί ποτέ.
   Το ίδιο ισχύει και για τον σύνδεσμο επαναφοράς κωδικού. */
function setPassScreen(msg, kind, mode){
 const t = mode==='invite'
   ? 'Καλώς ήρθατε. Ορίστε τον κωδικό σας.'
   : 'Ορίστε νέο κωδικό.';
 return `<div style="position:fixed;inset:0;background:var(--rail);display:grid;place-items:center;z-index:100;padding:24px">
  <div style="background:#fff;border-radius:12px;max-width:420px;width:100%;padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.4)">
   <div style="font-size:22px;font-weight:800;letter-spacing:.02em">ΑΠΕ</div>
   <div style="font-size:12.5px;color:var(--ink3);margin:3px 0 6px">Ανακεφαλαιωτικοί Πίνακες Εργασιών · Ν. 4412/2016</div>
   <p style="font-size:13.5px;margin:0 0 18px;color:var(--ink2)">${t}</p>
   ${msg?`<div class="note${kind==='bad'?' b':(kind==='ok'?' g':'')}" style="margin:0 0 16px">${msg}</div>`:''}
   <form onsubmit="doSetPassword(event)">
    <label class="f" style="margin-bottom:12px"><span>Νέος κωδικός</span>
     <input type="password" id="pw1" autocomplete="new-password" required minlength="8">
     <span class="hint">Τουλάχιστον 8 χαρακτήρες.</span></label>
    <label class="f" style="margin-bottom:18px"><span>Επανάληψη κωδικού</span>
     <input type="password" id="pw2" autocomplete="new-password" required minlength="8"></label>
    <button class="btn c1" type="submit" style="width:100%;justify-content:center" id="pwBtn">Αποθήκευση κωδικού</button>
   </form>
  </div></div>`;
}

let offlineMode=false, pendingMode=null;
function showLogin(msg,kind){ document.getElementById('login').innerHTML=loginScreen(msg,kind); }
function hideLogin(){ document.getElementById('login').innerHTML=''; }
function showSetPass(msg,kind){ document.getElementById('login').innerHTML=setPassScreen(msg,kind,pendingMode); }

/* Διαβάζει τη συνεδρία που έρχεται στο fragment του συνδέσμου και την
   καθαρίζει από τη διεύθυνση, ώστε να μη μείνει το token στο ιστορικό. */
function consumeAuthHash(){
 const h=(location.hash||'').replace(/^#/,'');
 if(!h) return null;
 const q=new URLSearchParams(h);
 const err=q.get('error_description')||q.get('error');
 const tok=q.get('access_token'), typ=q.get('type');
 if(!err && !tok) return null;
 history.replaceState(null,'',location.pathname+location.search);
 if(err) return {error:decodeURIComponent(err.replace(/\+/g,' '))};
 sessSave({access_token:tok, refresh_token:q.get('refresh_token')||'',
   expires_at:Math.floor(Date.now()/1000)+Number(q.get('expires_in')||3600), user:null});
 return {type:typ||'recovery'};
}

async function doSetPassword(ev){
 ev.preventDefault();
 const b=document.getElementById('pwBtn');
 const p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
 if(p1!==p2){ showSetPass('Οι δύο κωδικοί δεν ταιριάζουν.','bad'); return; }
 if(p1.length<8){ showSetPass('Ο κωδικός πρέπει να έχει τουλάχιστον 8 χαρακτήρες.','bad'); return; }
 b.disabled=true; b.textContent='Αποθήκευση…';
 try{
  const u=await sbCall('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:p1})});
  if(u&&u.id) sessSave(Object.assign({},sbSession,{user:u}));
  pendingMode=null; hideLogin(); render();
  try{ const r=await syncAll();
   flashMsg={k:'g',t:'Ο κωδικός ορίστηκε.',
     d:'Από εδώ και πέρα συνδέεστε με το ηλεκτρονικό σας ταχυδρομείο και αυτόν τον κωδικό.'
       +(r?` Λήφθηκαν ${r.pull.total} έργα από τη βάση.`:'')};
  }catch(e){ flashMsg={k:'g',t:'Ο κωδικός ορίστηκε.',d:'Ο συγχρονισμός θα γίνει μόλις υπάρξει σύνδεση.'}; }
  render();
 }catch(e){
  const raw=e.message||'';
  b.disabled=false; b.textContent='Αποθήκευση κωδικού';
  showSetPass(/expired|invalid|JWT/i.test(raw)
    ? 'Ο σύνδεσμος έληξε. Ζητήστε νέον με το «Ξέχασα τον κωδικό».'
    : /should be different|same as/i.test(raw)
      ? 'Ο νέος κωδικός πρέπει να διαφέρει από τον προηγούμενο.'
      : 'Δεν αποθηκεύτηκε: '+E(raw), 'bad');
 }
}

/* Αλλαγή κωδικού από συνδεδεμένο χρήστη. */
function changePassword(){ pendingMode='change'; showSetPass(); }

async function doLogin(ev){
 ev.preventDefault();
 const b=document.getElementById('loginBtn');
 const email=document.getElementById('loginEmail').value.trim();
 const pass=document.getElementById('loginPass').value;
 b.disabled=true; b.textContent='Σύνδεση…';
 try{
  await sbSignIn(email,pass);
  hideLogin();
  render();
  const r=await syncAll();
  if(r) flashMsg={k:'g',t:'Συνδεθήκατε.',
    d:`Λήφθηκαν ${r.pull.total} έργα από τη βάση (${r.pull.added} νέα, ${r.pull.updated} ενημερώθηκαν).`};
  render();
 }catch(e){
  const raw=e.message||'';
  const m = /Invalid login/i.test(raw)
    ? 'Λάθος ηλεκτρονικό ταχυδρομείο ή κωδικός.'
    : /Email not confirmed/i.test(raw)
      ? 'Ο λογαριασμός δεν έχει επιβεβαιωθεί. Ελέγξτε το ηλεκτρονικό σας ταχυδρομείο.'
      : /Failed to fetch|NetworkError|network/i.test(raw)
        ? 'Δεν υπάρχει σύνδεση με τη βάση. Ελέγξτε τη σύνδεσή σας στο διαδίκτυο — '
          +'μπορείτε να συνεχίσετε με «Εργασία χωρίς σύνδεση» και να συγχρονίσετε αργότερα.'
        : /rate limit|too many/i.test(raw)
          ? 'Πολλές προσπάθειες σε σύντομο διάστημα. Δοκιμάστε ξανά σε λίγα λεπτά.'
          : ('Η σύνδεση απέτυχε: '+E(raw));
  showLogin(m,'bad');
 }
}
async function doReset(){
 const email=(document.getElementById('loginEmail')||{}).value||'';
 if(!email.trim()){ showLogin('Συμπληρώστε πρώτα το ηλεκτρονικό σας ταχυδρομείο.','bad'); return; }
 try{ await sbResetPassword(email.trim());
  showLogin('Στάλθηκε σύνδεσμος επαναφοράς στο <b>'+E(email)+'</b>.','ok');
 }catch(e){
  const raw=e.message||'';
  /* Η ενσωματωμένη υπηρεσία ηλεκτρονικού ταχυδρομείου του Supabase επιτρέπει
     ελάχιστα μηνύματα την ώρα. Το ωμό «email rate limit exceeded» δεν λέει
     τίποτα στον χρήστη, ούτε τι να κάνει. */
  showLogin(
    /rate limit/i.test(raw)
      ? 'Έχουν σταλεί ήδη πολλά μηνύματα σε σύντομο διάστημα. Δοκιμάστε ξανά σε μία ώρα, '
        +'ή ζητήστε από τον διαχειριστή να σας ορίσει κωδικό.'
    : /Failed to fetch|NetworkError/i.test(raw)
      ? 'Δεν υπάρχει σύνδεση με τη βάση.'
    : /For security purposes|after \d+ seconds/i.test(raw)
      ? 'Περιμένετε λίγο πριν ζητήσετε νέο σύνδεσμο.'
      : 'Δεν στάλθηκε: '+E(raw), 'bad');
 }
}
function workOffline(){
 offlineMode=true; hideLogin(); render();
 flashMsg={k:'w',t:'Εργασία χωρίς σύνδεση.',
  d:'Τα έργα αποθηκεύονται μόνο σε αυτόν τον υπολογιστή. Συνδεθείτε για να συγχρονιστούν.'};
 render();
}
async function doLogout(){
 if(syncState.pending && !confirm('Υπάρχουν '+syncState.pending+' έργα που δεν έχουν συγχρονιστεί.\n\nΑποσύνδεση;')) return;
 await sbSignOut(); offlineMode=false; showLogin();
}

/* ── γραμμή κατάστασης συγχρονισμού ───────────────────────────────── */
function renderSyncBar(){
 const el=document.getElementById('syncbar'); if(!el)return;
 if(!SB_ON){ el.innerHTML=''; return; }
 if(offlineMode||!sessValid()){
  el.innerHTML=`<button onclick="showLogin()" style="width:100%">🔌 Χωρίς σύνδεση — είσοδος</button>`;
  return;
 }
 const who=(sbSession.user&&sbSession.user.email)||'';
 const st = syncState.busy ? '⟳ Συγχρονισμός…'
   : syncState.error ? '⚠ '+E(syncState.error)
   : syncState.pending ? '● '+syncState.pending+' προς αποστολή'
   : '✓ Συγχρονισμένο';
 el.innerHTML=`<div class="mtag" style="margin-bottom:5px;overflow:hidden;text-overflow:ellipsis">${E(who)}</div>
  <button onclick="manualSync()" style="width:100%;margin-bottom:4px" ${syncState.busy?'disabled':''}>${st}</button>
  <button onclick="changePassword()" style="width:100%;margin-bottom:4px">Αλλαγή κωδικού</button>
  <button onclick="doLogout()" style="width:100%">Αποσύνδεση</button>`;
}
async function manualSync(){
 try{
  const r=await syncAll();
  if(r){
   flashMsg = r.conflicts.length
    ? {k:'w',t:'Ο συγχρονισμός ολοκληρώθηκε με '+r.conflicts.length+' διενέξεις.',
       d:'Τα έργα «'+r.conflicts.map(E).join('», «')+'» άλλαξαν και από αλλού. '
        +'Οι τοπικές σας αλλαγές ΔΕΝ γράφτηκαν από πάνω. Πατήστε ξανά συγχρονισμό για να δείτε την έκδοση της βάσης.'}
    : {k:'g',t:'Συγχρονίστηκαν '+r.pushed+' έργα.',
       d:`Από τη βάση: ${r.pull.added} νέα, ${r.pull.updated} ενημερώθηκαν.`};
   render();
  }
 }catch(e){ flashMsg={k:'b',t:'Ο συγχρονισμός απέτυχε.',d:E(e.message||'')}; render(); }
}

/* ── εκκίνηση ─────────────────────────────────────────────────────── */
async function bootAuth(){
 if(!SB_ON){ renderSyncBar(); return; }

 /* Πρώτα ο σύνδεσμος πρόσκλησης ή επαναφοράς, αν υπάρχει. */
 const cb=consumeAuthHash();
 if(cb && cb.error){ showLogin('Ο σύνδεσμος δεν ισχύει πια: '+E(cb.error)
   +'<br>Ζητήστε νέον με το «Ξέχασα τον κωδικό».','bad'); return; }
 if(cb){ pendingMode=cb.type; renderSyncBar(); showSetPass(); return; }

 sessLoad();
 if(sessValid() || (sbSession && await sbRefresh())){
  renderSyncBar();
  try{ await syncAll(); render(); }catch(e){ /* offline — συνεχίζουμε τοπικά */ }
 }else{
  showLogin();
 }
}

</script>
