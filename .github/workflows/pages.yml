name: Δημοσίευση στο GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Απαιτείται μία φορά, χειροκίνητα:
      #   Settings → Pages → Source: GitHub Actions
      # Το enablement: true δεν λειτουργεί εδώ — ο GITHUB_TOKEN του workflow
      # δεν έχει δικαίωμα να δημιουργήσει το Pages site.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
